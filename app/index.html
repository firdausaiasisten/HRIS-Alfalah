<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sistem Informasi Kepegawaian Pesantren Modern Al-Falah Abu Lam U" />
  <title>HRIS Al-Falah</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0E505A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="HRIS Al-Falah" />

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Philosopher:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- SheetJS for Excel Export/Import -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <!-- Chart.js for Analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <style>
    /* ============================================================
       CSS CUSTOM PROPERTIES — LIGHT & DARK THEMES
       ============================================================ */
    :root {
      --brand-dark:    #0E505A;
      --brand-mid:     #3F8D58;
      --brand-light:   #7DD857;
      --brand-accent:  #50A158;

      /* Surfaces */
      --bg:            #f4f7f5;
      --surface:       #ffffff;
      --surface-2:     #f9fbfa;
      --border:        #e3e3e0;
      --border-strong: #c8d3cf;

      /* Text */
      --ink:           #16302C;
      --ink-2:         #2e4e48;
      --muted:         #5b6b66;
      --muted-2:       #8a9e99;

      /* Metrics */
      --metric-bg:     #f0f7f2;

      /* Badges */
      --badge-green-bg: #e3f5e3; --badge-green-fg: #1e7d1e;
      --badge-amber-bg: #fdf1de; --badge-amber-fg: #8a5a10;
      --badge-red-bg:   #fde3e3; --badge-red-fg:   #a02020;
      --badge-gray-bg:  #eeeeee; --badge-gray-fg:   #666666;
      --badge-blue-bg:  #deedf9; --badge-blue-fg:   #1a5a8a;

      /* Shadows */
      --shadow-sm:  0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
      --shadow-md:  0 4px 12px rgba(0,0,0,.08);

      /* Transitions */
      --transition: all 0.2s ease;
    }

    [data-theme="dark"] {
      --bg:            #0f1a18;
      --surface:       #1a2e2a;
      --surface-2:     #223330;
      --border:        #2e4440;
      --border-strong: #3a5550;

      --ink:           #e8f0ee;
      --ink-2:         #c4d8d4;
      --muted:         #8aada8;
      --muted-2:       #5f8680;

      --metric-bg:     #1e3530;

      --badge-green-bg: #1a3a1a; --badge-green-fg: #6dd46d;
      --badge-amber-bg: #3a2a10; --badge-amber-fg: #e0a040;
      --badge-red-bg:   #3a1a1a; --badge-red-fg:   #e06060;
      --badge-gray-bg:  #2a2a2a; --badge-gray-fg:  #aaaaaa;
      --badge-blue-bg:  #1a2a3a; --badge-blue-fg:  #60a8e0;

      --shadow-sm:  0 1px 3px rgba(0,0,0,.3);
      --shadow-md:  0 4px 12px rgba(0,0,0,.4);
    }

    /* ============================================================
       RESET & BASE
       ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--ink);
      font-size: 14px;
      line-height: 1.5;
      transition: background 0.3s ease, color 0.3s ease;
      padding: 12px;
      min-height: 100vh;
    }

    /* ============================================================
       HEADER BANNER
       ============================================================ */
    .hb {
      background: linear-gradient(135deg, #0E505A 0%, #2E7859 40%, #50A158 70%, #7DD857 100%);
      border-radius: 14px;
      padding: 1.25rem 1.5rem;
      color: #fff;
      margin-bottom: 1rem;
      box-shadow: var(--shadow-md);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .hb h1 {
      font-family: 'Philosopher', serif;
      font-weight: 700;
      font-size: 18px;
      letter-spacing: .3px;
    }
    .hb p { font-size: 12px; opacity: .88; margin-top: 3px; }

    .hb-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    /* ============================================================
       DARK MODE TOGGLE
       ============================================================ */
    .dm-toggle {
      width: 42px; height: 24px;
      background: rgba(255,255,255,0.25);
      border-radius: 12px;
      border: 1.5px solid rgba(255,255,255,0.5);
      cursor: pointer;
      position: relative;
      transition: var(--transition);
      flex-shrink: 0;
    }
    .dm-toggle::after {
      content: '';
      position: absolute;
      top: 2px; left: 2px;
      width: 16px; height: 16px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.2s ease;
    }
    [data-theme="dark"] .dm-toggle { background: rgba(125,216,87,0.4); border-color: rgba(125,216,87,0.7); }
    [data-theme="dark"] .dm-toggle::after { transform: translateX(18px); }

    .dm-icon { font-size: 14px; line-height: 1; }

    /* ============================================================
       CARDS
       ============================================================ */
    .card {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    /* ============================================================
       GRID
       ============================================================ */
    .grid { display: grid; gap: 12px; }
    .grid-2 { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
    .grid-3 { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
    .grid-4 { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }

    /* ============================================================
       METRICS
       ============================================================ */
    .metric {
      background: var(--metric-bg);
      border-radius: 10px;
      padding: 1rem 1.1rem;
      transition: background 0.3s ease;
    }
    .metric .lbl { font-size: 11px; color: var(--muted); margin-bottom: 6px; font-weight: 500; text-transform: uppercase; letter-spacing: .4px; }
    .metric .val { font-size: 24px; font-weight: 700; color: var(--brand-dark); }
    [data-theme="dark"] .metric .val { color: var(--brand-light); }
    .metric .trend { font-size: 11px; color: var(--muted); margin-top: 2px; }

    /* ============================================================
       BUTTONS
       ============================================================ */
    .btn {
      border: 0.5px solid var(--border-strong);
      background: var(--surface);
      color: var(--ink);
      border-radius: 8px;
      padding: 7px 14px;
      font-size: 13px;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }
    .btn:hover { background: var(--surface-2); box-shadow: var(--shadow-sm); }
    .btn-primary { background: var(--brand-dark); color: #fff; border-color: transparent; }
    .btn-primary:hover { background: #0a3d45; }
    .btn-success { background: #1e7d1e; color: #fff; border-color: transparent; }
    .btn-success:hover { background: #165a16; }
    .btn-danger { background: #a02020; color: #fff; border-color: transparent; }
    .btn-danger:hover { background: #7a1818; }
    .btn-sm { padding: 4px 10px; font-size: 12px; border-radius: 6px; }
    .btn-icon { padding: 6px 10px; }

    .btn-group { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

    /* ============================================================
       TABS
       ============================================================ */
    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      padding: 7px 15px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: 0.5px solid transparent;
      white-space: nowrap;
      transition: var(--transition);
      color: var(--muted);
    }
    .tab:hover { background: var(--surface); color: var(--ink); }
    .tab.active { background: var(--brand-dark); color: #fff; box-shadow: var(--shadow-sm); }

    /* ============================================================
       FORM ELEMENTS
       ============================================================ */
    input, select, textarea {
      width: 100%;
      padding: 7px 10px;
      border: 0.5px solid var(--border-strong);
      border-radius: 7px;
      font-size: 13px;
      font-family: inherit;
      background: var(--surface);
      color: var(--ink);
      transition: var(--transition);
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--brand-dark);
      box-shadow: 0 0 0 3px rgba(14, 80, 90, 0.12);
    }
    label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 3px; font-weight: 500; }
    .field { margin-bottom: 10px; }

    /* ============================================================
       TABLE
       ============================================================ */
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 9px 8px; border-bottom: 0.5px solid var(--border); }
    th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .4px; background: var(--surface-2); }
    tr:hover td { background: var(--metric-bg); }
    td { color: var(--ink-2); }
    .table-wrap { overflow-x: auto; border-radius: 8px; }

    /* ============================================================
       BADGES
       ============================================================ */
    .badge {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .2px;
    }
    .badge-green { background: var(--badge-green-bg); color: var(--badge-green-fg); }
    .badge-amber { background: var(--badge-amber-bg); color: var(--badge-amber-fg); }
    .badge-red   { background: var(--badge-red-bg);   color: var(--badge-red-fg);   }
    .badge-gray  { background: var(--badge-gray-bg);  color: var(--badge-gray-fg);  }
    .badge-blue  { background: var(--badge-blue-bg);  color: var(--badge-blue-fg);  }

    /* ============================================================
       MISC UTILITIES
       ============================================================ */
    .link { color: var(--brand-dark); cursor: pointer; text-decoration: underline; }
    [data-theme="dark"] .link { color: var(--brand-light); }
    .err { color: var(--badge-red-fg); font-size: 13px; margin: 6px 0; }
    .section-title {
      font-weight: 700;
      font-size: 12px;
      color: var(--brand-dark);
      margin: 16px 0 8px;
      border-bottom: 1.5px solid var(--border);
      padding-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    [data-theme="dark"] .section-title { color: var(--brand-light); }
    .searchbar { margin-bottom: 12px; position: relative; }
    .searchbar input { padding-left: 32px; }
    .searchbar::before { content: '🔍'; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 12px; }

    .loading-spinner {
      display: flex; align-items: center; gap: 10px;
      color: var(--muted); padding: 24px 0; font-size: 13px;
    }
    .spinner {
      width: 20px; height: 20px;
      border: 2.5px solid var(--border-strong);
      border-top-color: var(--brand-dark);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* PWA install banner */
    #install-banner {
      display: none;
      background: linear-gradient(90deg, var(--brand-dark), var(--brand-mid));
      color: #fff;
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 10px;
      font-size: 13px;
      align-items: center;
      gap: 10px;
      justify-content: space-between;
    }
    #install-banner.visible { display: flex; }

    /* Online/offline indicator */
    #offline-badge {
      display: none;
      background: var(--badge-amber-bg);
      color: var(--badge-amber-fg);
      border-radius: 6px;
      padding: 3px 10px;
      font-size: 12px;
      font-weight: 600;
    }
    body.offline #offline-badge { display: inline-block; }

    /* Chart container */
    .chart-wrap {
      position: relative;
      height: 220px;
    }

    /* Role badge in header */
    .role-pill {
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 11px;
      font-weight: 600;
      color: #fff;
    }

    /* Analytics tab */
    .analytics-card {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      box-shadow: var(--shadow-sm);
    }
    .analytics-card h4 { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 10px; text-transform: uppercase; letter-spacing:.4px; }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface);
      border-radius: 14px;
      padding: 1.5rem;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow-md);
    }
    .modal h3 { font-size: 16px; font-weight: 700; margin-bottom: 14px; color: var(--ink); }
    .modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

    /* Responsive */
    @media (max-width: 600px) {
      body { padding: 8px; }
      .hb { padding: 1rem; }
      .hb h1 { font-size: 15px; }
    }
  </style>
</head>
<body>

<!-- PWA Install Banner -->
<div id="install-banner">
  <span>📱 Install HRIS Al-Falah sebagai aplikasi</span>
  <div style="display:flex;gap:6px;">
    <button class="btn btn-sm" style="background:rgba(255,255,255,0.9);color:#0E505A;font-weight:700;" id="install-btn">Install</button>
    <button class="btn btn-sm" style="background:transparent;border-color:rgba(255,255,255,0.5);color:#fff;" id="install-dismiss">✕</button>
  </div>
</div>

<div id="hris-root"></div>

<!-- Leave Request Modal -->
<div class="modal-overlay" id="leave-modal">
  <div class="modal">
    <h3>📋 Ajukan Cuti / Izin</h3>
    <div class="field">
      <label>Jenis</label>
      <select id="lv-type">
        <option value="Cuti Tahunan">Cuti Tahunan</option>
        <option value="Cuti Sakit">Cuti Sakit</option>
        <option value="Cuti Melahirkan">Cuti Melahirkan</option>
        <option value="Izin Khusus">Izin Khusus</option>
        <option value="Cuti Lainnya">Cuti Lainnya</option>
      </select>
    </div>
    <div class="grid grid-2">
      <div class="field"><label>Tanggal Mulai</label><input type="date" id="lv-start" /></div>
      <div class="field"><label>Tanggal Selesai</label><input type="date" id="lv-end" /></div>
    </div>
    <div class="field"><label>Keterangan</label><textarea id="lv-notes" rows="3" style="resize:vertical;"></textarea></div>
    <div id="lv-error" class="err"></div>
    <div class="modal-footer">
      <button class="btn" onclick="closeLeaveModal()">Batal</button>
      <button class="btn btn-primary" id="lv-submit">Kirim Pengajuan</button>
    </div>
  </div>
</div>

<script>
(function(){
  /* ================================================================
     CONFIG & STATE
     ================================================================ */
  var SUPABASE_URL = "https://tnqeicxwxwtufuglxmdb.supabase.co";
  var ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRucWVpY3h3eHd0dWZ1Z2x4bWRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3NDMxNTksImV4cCI6MjEwMTMxOTE1OX0.QmH_sZ3fv6rywlCqj5cmX1VDjQHYTeOr7psAp7GMIKg";

  var state = {
    session: null, user: null, role: null, fullName: null,
    view: "login", authMode: "login",
    employees: [], masters: {}, reviews: [], leaveRequests: [],
    selectedEmployeeId: null, editing: false, loading: false, errorMsg: "",
    teaching: [], history: [],
    chartInstances: {}
  };

  /* ================================================================
     ROLE PERMISSIONS
     ================================================================ */
  var ROLE_CONFIG = {
    admin: {
      label: "Admin",
      tabs: ["dashboard", "analytics", "biodata", "leave_management", "notifications", "export_import"],
      canEdit: true, canApproveLeave: true, canExport: true, canImport: true,
      canManageRoles: true
    },
    hrd_staff: {
      label: "Staf HRD",
      tabs: ["dashboard", "analytics", "biodata", "leave_management", "notifications", "export_import"],
      canEdit: true, canApproveLeave: true, canExport: true, canImport: false,
      canManageRoles: false
    },
    pimpinan: {
      label: "Pimpinan",
      tabs: ["dashboard", "analytics", "biodata", "notifications"],
      canEdit: false, canApproveLeave: false, canExport: true, canImport: false,
      canManageRoles: false
    }
  };

  function roleConfig(){ return ROLE_CONFIG[state.role] || { label: state.role, tabs:["dashboard"], canEdit:false, canApproveLeave:false, canExport:false, canImport:false }; }
  function can(perm){ return !!roleConfig()[perm]; }
  function hasTab(tab){ return (roleConfig().tabs || []).indexOf(tab) >= 0; }

  /* ================================================================
     DARK MODE
     ================================================================ */
  function getTheme(){ return localStorage.getItem('hris-theme') || 'light'; }
  function applyTheme(t){
    document.documentElement.setAttribute('data-theme', t);
    localStorage.setItem('hris-theme', t);
    // Update Chart.js defaults for dark mode
    if (window.Chart) {
      var isDark = t === 'dark';
      Chart.defaults.color = isDark ? '#8aada8' : '#5b6b66';
      Chart.defaults.borderColor = isDark ? '#2e4440' : '#e3e3e0';
    }
  }
  function toggleTheme(){
    applyTheme(getTheme() === 'dark' ? 'light' : 'dark');
  }
  // Apply on load
  applyTheme(getTheme());

  /* ================================================================
     PWA
     ================================================================ */
  var deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById('install-banner').classList.add('visible');
  });
  document.getElementById('install-btn').onclick = function(){
    if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt.userChoice.then(function(){ deferredPrompt=null; document.getElementById('install-banner').classList.remove('visible'); }); }
  };
  document.getElementById('install-dismiss').onclick = function(){
    document.getElementById('install-banner').classList.remove('visible');
  };

  // Offline/online detection
  function updateOnline(){
    document.body.classList.toggle('offline', !navigator.onLine);
  }
  window.addEventListener('online', updateOnline);
  window.addEventListener('offline', updateOnline);
  updateOnline();

  // Register service worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  }

  /* ================================================================
     UTILS
     ================================================================ */
  function root(){ return document.getElementById("hris-root"); }
  function authHeaders(json){
    var h = { apikey: ANON_KEY, Authorization: "Bearer " + (state.session ? state.session.access_token : ANON_KEY) };
    if (json) h["Content-Type"] = "application/json";
    return h;
  }
  function api(path, opts){
    opts = opts || {};
    return fetch(SUPABASE_URL + path, {
      method: opts.method || "GET",
      headers: Object.assign(authHeaders(true), opts.headers || {}),
      body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function(res){
      return res.text().then(function(txt){
        var data = txt ? JSON.parse(txt) : null;
        if (!res.ok){ throw new Error((data && (data.msg || data.message || data.error_description)) || res.statusText); }
        return data;
      });
    });
  }
  function fmtDate(d){ if(!d) return "-"; var dt=new Date(d); return dt.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}); }
  function fmtMoney(n){ if(n===null||n===undefined) return "-"; return "Rp " + Number(n).toLocaleString('id-ID'); }
  function daysUntil(d){ if(!d) return null; var diff = (new Date(d) - new Date()); return Math.ceil(diff/(1000*60*60*24)); }
  function escHtml(s){ if(!s) return ""; return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function destroyCharts(){
    Object.keys(state.chartInstances).forEach(function(k){
      if(state.chartInstances[k]) { state.chartInstances[k].destroy(); }
    });
    state.chartInstances = {};
  }

  /* ================================================================
     AUTH
     ================================================================ */
  function signUp(email, password, fullName){
    state.loading = true; render();
    api("/auth/v1/signup", { method:"POST", body:{ email:email, password:password, data:{ full_name:fullName } } })
      .then(function(data){
        state.loading = false;
        if (data.access_token){ onAuthed(data); }
        else { state.errorMsg = "Akun dibuat. Cek email untuk konfirmasi, lalu login."; state.authMode="login"; render(); }
      })
      .catch(function(e){ state.loading=false; state.errorMsg = e.message; render(); });
  }
  function signIn(email, password){
    state.loading = true; render();
    api("/auth/v1/token?grant_type=password", { method:"POST", body:{ email:email, password:password } })
      .then(function(data){ state.loading=false; onAuthed(data); })
      .catch(function(e){ state.loading=false; state.errorMsg = "Login gagal: " + e.message; render(); });
  }
  function onAuthed(data){
    state.session = data; state.user = data.user; state.errorMsg = "";
    fetchRole().then(function(){ state.view = "app"; loadAll(); });
  }
  function fetchRole(){
    return api("/rest/v1/user_roles?select=role,full_name&user_id=eq." + state.user.id)
      .then(function(rows){
        if (rows && rows[0]){ state.role = rows[0].role; state.fullName = rows[0].full_name; }
        else { state.role = "pending"; }
        render();
      });
  }
  function signOut(){
    destroyCharts();

  }

  /* ================================================================
     DATA LOADING
     ================================================================ */
  function loadAll(){
    state.loading = true; render();
    Promise.all([
      api("/rest/v1/employees?select=*,m_unit_kerja(nama),m_departemen(nama),m_jabatan(nama),m_status_kepegawaian(nama),m_jenis_kepegawaian(nama),m_bank(nama),m_agama(nama),m_status_perkawinan(nama)&deleted_at=is.null&order=full_name.asc"),
      api("/rest/v1/performance_reviews?select=*&deleted_at=is.null&order=review_date.desc"),
      api("/rest/v1/m_unit_kerja?select=*&order=nama.asc"),
      api("/rest/v1/m_departemen?select=*&order=nama.asc"),
      api("/rest/v1/m_jabatan?select=*&order=nama.asc"),
      api("/rest/v1/m_status_kepegawaian?select=*"),
      api("/rest/v1/m_jenis_kepegawaian?select=*"),
      api("/rest/v1/m_bank?select=*"),
      api("/rest/v1/m_agama?select=*"),
      api("/rest/v1/m_status_perkawinan?select=*"),
      api("/rest/v1/employee_teaching_assignment?select=*"),
      api("/rest/v1/employment_history?select=*&order=effective_date.desc")
    ]).then(function(r){
      state.employees = r[0] || []; state.reviews = r[1] || [];
      state.masters = { unit:r[2]||[], dept:r[3]||[], jabatan:r[4]||[], statusKp:r[5]||[], jenisKp:r[6]||[], bank:r[7]||[], agama:r[8]||[], kawin:r[9]||[] };
      state.teaching = r[10]||[]; state.history = r[11]||[];
      state.loading = false; render();
    }).catch(function(e){ state.loading=false; state.errorMsg = "Gagal memuat data: " + e.message; render(); });
  }
  function latestReview(empId){
    var rv = state.reviews.filter(function(r){ return r.employee_id === empId; });
    return rv.length ? rv[0] : null;
  }

  /* ================================================================

     ================================================================ */
  function render(){
    destroyCharts();
    if (state.view === "login" || !state.session){ renderLogin(); return; }
    if (state.role === "pending"){ renderPending(); return; }
    renderApp();
  }

  function renderApp(){

          '<h1>PESANTREN MODERN AL-FALAH ABU LAM U</h1>' +

        }).join('') +
      '</div>' +

    document.getElementById("dm-btn").onclick = toggleTheme;

  /* ================================================================
     RENDER: DASHBOARD
     ================================================================ */
  function renderDashboard(){
    var el = document.getElementById("tab-content");
    if (state.loading){ el.innerHTML = '<div class="loading-spinner"><div class="spinner"></div> Memuat data...</div>'; return; }
    var emps = state.employees;
    var total = emps.length;
    var aktif = emps.filter(function(e){ return e.active_status; }).length;
    var akanBerakhir = emps.filter(function(e){ var d = daysUntil(e.contract_end); return d!==null && d>=0 && d<=30; });
    var scored = emps.map(function(e){ var r = latestReview(e.id); return { emp:e, score: r?parseFloat(r.score_total):null, predikat:r?r.predikat:null }; }).filter(function(x){ return x.score!==null; });
    var avgScore = scored.length ? (scored.reduce(function(s,x){ return s+x.score; },0)/scored.length).toFixed(1) : "-";
    scored.sort(function(a,b){ return b.score-a.score; });
    var top = scored.slice(0,5);
    var bottom = scored.slice(-3).reverse();
    var byUnit = {};
    emps.forEach(function(e){ var u = (e.m_unit_kerja && e.m_unit_kerja.nama) || "Tanpa Unit"; byUnit[u]=(byUnit[u]||0)+1; });
    var byGender = { L:0, P:0, lain:0 };
    emps.forEach(function(e){ if(e.gender==="L") byGender.L++; else if(e.gender==="P") byGender.P++; else byGender.lain++; });
    function predikatBadge(p){
      if (!p) return '<span class="badge badge-gray">-</span>';
      var cls = (p==="Sangat Baik"||p==="Baik")?"badge-green": p==="Cukup"?"badge-amber":"badge-red";
      return '<span class="badge ' + cls + '">' + escHtml(p) + '</span>';
    }
    var html =
      '<div class="grid grid-4" style="margin-bottom:12px;">' +
        '<div class="metric"><p class="lbl">Total Pegawai</p><p class="val">' + total + '</p><p class="trend">Seluruh data pegawai</p></div>' +
        '<div class="metric"><p class="lbl">Pegawai Aktif</p><p class="val">' + aktif + '</p><p class="trend">' + (total?Math.round(aktif/total*100):0) + '% dari total</p></div>' +
        '<div class="metric"><p class="lbl">Kontrak ≤ 30 Hari</p><p class="val">' + akanBerakhir.length + '</p><p class="trend">Perlu perhatian</p></div>' +
        '<div class="metric"><p class="lbl">Rata-rata Kinerja</p><p class="val">' + avgScore + '</p><p class="trend">Dari ' + scored.length + ' penilaian</p></div>' +
      '</div>';

    if (akanBerakhir.length){
      html += '<div class="section-title">⚠ Kontrak Akan Berakhir</div><div class="card"><div class="table-wrap"><table>' +
        '<tr><th>Nama</th><th>Jabatan</th><th>Unit Kerja</th><th>Berakhir</th><th>Sisa Hari</th></tr>' +
        akanBerakhir.map(function(e){
          var d = daysUntil(e.contract_end);
          return '<tr><td>' + escHtml(e.full_name) + '</td><td>' + escHtml((e.m_jabatan&&e.m_jabatan.nama)||"-") + '</td><td>' + escHtml((e.m_unit_kerja&&e.m_unit_kerja.nama)||"-") + '</td><td>' + fmtDate(e.contract_end) + '</td><td><span class="badge ' + (d<=7?"badge-red":"badge-amber") + '">' + d + ' hari</span></td></tr>';
        }).join('') + '</table></div></div>';
    }

    html += '<div class="grid grid-2">' +
      '<div>' +
        '<div class="section-title">🏆 Top Performer</div>' +
        '<div class="card"><div class="table-wrap"><table><tr><th>#</th><th>Nama</th><th>Skor</th><th>Predikat</th></tr>' +
        (top.length ? top.map(function(x,i){ return '<tr><td><b>' + (i+1) + '</b></td><td>' + escHtml(x.emp.full_name) + '</td><td>' + x.score.toFixed(1) + '</td><td>' + predikatBadge(x.predikat) + '</td></tr>'; }).join('') : '<tr><td colspan="4" style="color:var(--muted);">Belum ada data penilaian</td></tr>') +
        '</table></div></div>' +
      '</div>' +
      '<div>' +
        '<div class="section-title">📋 Perlu Pembinaan</div>' +
        '<div class="card"><div class="table-wrap"><table><tr><th>Nama</th><th>Skor</th><th>Predikat</th></tr>' +
        (bottom.length ? bottom.map(function(x){ return '<tr><td>' + escHtml(x.emp.full_name) + '</td><td>' + x.score.toFixed(1) + '</td><td>' + predikatBadge(x.predikat) + '</td></tr>'; }).join('') : '<tr><td colspan="3" style="color:var(--muted);">Belum ada data</td></tr>') +
        '</table></div></div>' +
      '</div>' +
    '</div>';

    html += '<div class="section-title">🏢 Distribusi per Unit Kerja</div><div class="card"><div class="table-wrap"><table><tr><th>Unit Kerja</th><th>Jumlah</th><th>Komposisi</th></tr>' +
      Object.keys(byUnit).map(function(u){
        var pct = total ? Math.round(byUnit[u]/total*100) : 0;
        return '<tr><td>' + escHtml(u) + '</td><td>' + byUnit[u] + '</td><td><div style="background:var(--border);border-radius:4px;height:8px;width:100%;"><div style="background:var(--brand-dark);border-radius:4px;height:8px;width:' + pct + '%;"></div></div></td></tr>';
      }).join('') + '</table></div></div>';

    el.innerHTML = html;
  }

  /* ================================================================
     RENDER: HR ANALYTICS DASHBOARD
     ================================================================ */
  function renderAnalytics(){
    var el = document.getElementById("tab-content");
    if (state.loading){ el.innerHTML = '<div class="loading-spinner"><div class="spinner"></div> Memuat data...</div>'; return; }
    var emps = state.employees;
    var byUnit = {}; var byGender = {L:0,P:0,Lainnya:0}; var byStatus = {};
    var byJenis = {}; var joinByYear = {};
    emps.forEach(function(e){
      var u = (e.m_unit_kerja&&e.m_unit_kerja.nama)||"Tanpa Unit"; byUnit[u]=(byUnit[u]||0)+1;
      if(e.gender==="L") byGender.L++; else if(e.gender==="P") byGender.P++; else byGender.Lainnya++;
      var s=(e.m_status_kepegawaian&&e.m_status_kepegawaian.nama)||"Tidak Diketahui"; byStatus[s]=(byStatus[s]||0)+1;
      var j=(e.m_jenis_kepegawaian&&e.m_jenis_kepegawaian.nama)||"Tidak Diketahui"; byJenis[j]=(byJenis[j]||0)+1;
      if(e.join_date){ var yr=new Date(e.join_date).getFullYear(); joinByYear[yr]=(joinByYear[yr]||0)+1; }
    });
    var scored = emps.map(function(e){ var r=latestReview(e.id); return r?parseFloat(r.score_total):null; }).filter(function(x){ return x!==null; });
    var scoreRanges = {"< 60":0, "60-70":0, "70-80":0, "80-90":0, "≥ 90":0};
    scored.forEach(function(s){ if(s<60) scoreRanges["< 60"]++; else if(s<70) scoreRanges["60-70"]++; else if(s<80) scoreRanges["70-80"]++; else if(s<90) scoreRanges["80-90"]++; else scoreRanges["≥ 90"]++; });
    var sortedYears = Object.keys(joinByYear).sort();
    var palette = ['#0E505A','#3F8D58','#7DD857','#50A158','#2E7859','#0a3d45','#6dba4a','#1e6040'];

    el.innerHTML =
      '<div class="section-title">📈 Analitik HR — Ringkasan Visual</div>' +
      '<div class="grid grid-2">' +
        '<div class="analytics-card"><h4>Distribusi Unit Kerja</h4><div class="chart-wrap"><canvas id="c-unit"></canvas></div></div>' +
        '<div class="analytics-card"><h4>Komposisi Gender</h4><div class="chart-wrap"><canvas id="c-gender"></canvas></div></div>' +
        '<div class="analytics-card"><h4>Status Kepegawaian</h4><div class="chart-wrap"><canvas id="c-status"></canvas></div></div>' +
        '<div class="analytics-card"><h4>Jenis Kepegawaian</h4><div class="chart-wrap"><canvas id="c-jenis"></canvas></div></div>' +
        '<div class="analytics-card"><h4>Tren Rekrutmen per Tahun</h4><div class="chart-wrap"><canvas id="c-join"></canvas></div></div>' +
        '<div class="analytics-card"><h4>Distribusi Skor Kinerja</h4><div class="chart-wrap"><canvas id="c-score"></canvas></div></div>' +
      '</div>';

    // Helper
    function mkChart(id, type, labels, data, opts){
      var ctx = document.getElementById(id);
      if(!ctx) return;
      var isDark = getTheme()==='dark';
      var textColor = isDark ? '#8aada8' : '#5b6b66';
      var gridColor = isDark ? '#2e4440' : '#e3e3e0';
      var instance = new Chart(ctx, {
        type: type,
        data: {
          labels: labels,
          datasets: [{ data: data, backgroundColor: palette, borderColor: type==='line'?palette[0]:undefined, borderWidth: type==='line'?2.5:1.5, fill: type==='line', tension:0.4, pointRadius:4 }]
        },
        options: Object.assign({
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: type!=='bar'&&type!=='line', labels:{ color:textColor, boxWidth:12, font:{size:11} } } },
          scales: (type==='bar'||type==='line') ? { x:{ticks:{color:textColor,font:{size:10}},grid:{color:gridColor}}, y:{ticks:{color:textColor,font:{size:10}},grid:{color:gridColor},beginAtZero:true} } : undefined
        }, opts||{})
      });
      state.chartInstances[id] = instance;
    }

    setTimeout(function(){
      mkChart('c-unit', 'doughnut', Object.keys(byUnit), Object.values(byUnit));
      mkChart('c-gender', 'pie', Object.keys(byGender), Object.values(byGender));
      mkChart('c-status', 'doughnut', Object.keys(byStatus), Object.values(byStatus));
      mkChart('c-jenis', 'doughnut', Object.keys(byJenis), Object.values(byJenis));
      mkChart('c-join', 'bar', sortedYears, sortedYears.map(function(y){ return joinByYear[y]; }));
      mkChart('c-score', 'bar', Object.keys(scoreRanges), Object.values(scoreRanges));
    }, 50);
  }

  /* ================================================================
     LEAVE MANAGEMENT
     ================================================================ */
  function loadLeaveRequests(){
    state.loading = true; render();
    api("/rest/v1/leave_requests?select=*,employees(full_name)&order=created_at.desc", { method:"GET" })
      .then(function(rows){
        state.leaveRequests = rows || [];
        state.loading = false;
        renderLeaveManagement();
      })
      .catch(function(e){ state.errorMsg = "Gagal memuat cuti: " + e.message; state.loading=false; render(); });
  }

  function renderLeaveManagement(){
    var el = document.getElementById("tab-content");
    if (state.loading){ el.innerHTML = '<div class="loading-spinner"><div class="spinner"></div> Memuat data...</div>'; return; }
    var rows = state.leaveRequests || [];

    var html = '<div class="btn-group" style="margin-bottom:12px;">' +
      '<div class="section-title" style="margin:0;flex:1;">🗓 Manajemen Cuti & Izin</div>' +
      '<button class="btn btn-primary btn-sm" id="new-leave-btn">+ Ajukan Cuti</button>' +
    '</div>';

    // Summary stats
    var pending = rows.filter(function(r){ return r.status==="Pending"; }).length;
    var approved = rows.filter(function(r){ return r.status==="Approved"; }).length;
    html += '<div class="grid grid-3" style="margin-bottom:12px;">' +
      '<div class="metric"><p class="lbl">Total Pengajuan</p><p class="val">' + rows.length + '</p></div>' +
      '<div class="metric"><p class="lbl">Menunggu</p><p class="val" style="color:var(--badge-amber-fg);">' + pending + '</p></div>' +
      '<div class="metric"><p class="lbl">Disetujui</p><p class="val" style="color:var(--badge-green-fg);">' + approved + '</p></div>' +
    '</div>';

    html += '<div class="card"><div class="table-wrap"><table>' +
      '<tr><th>Pegawai</th><th>Jenis</th><th>Mulai</th><th>Selesai</th><th>Status</th>' +
      (can("canApproveLeave") ? '<th>Aksi</th>' : '') + '</tr>' +
      (rows.length ? rows.map(function(r){
        var statusBadge =
          r.status==="Approved" ? '<span class="badge badge-green">✓ Disetujui</span>' :
          r.status==="Rejected" ? '<span class="badge badge-red">✕ Ditolak</span>' :
          '<span class="badge badge-amber">⏳ Pending</span>';
        var actions = '';
        if (can("canApproveLeave") && r.status==="Pending"){
          actions = '<button class="btn btn-success btn-sm" onclick="approveLeave(\'' + r.id + '\')">Setujui</button> ' +
                    '<button class="btn btn-danger btn-sm" onclick="rejectLeave(\'' + r.id + '\')">Tolak</button>';
        }
        return '<tr><td>' + escHtml((r.employees&&r.employees.full_name)||"-") + '</td><td>' + escHtml(r.type||"-") + '</td><td>' + fmtDate(r.start_date) + '</td><td>' + fmtDate(r.end_date) + '</td><td>' + statusBadge + '</td>' + (can("canApproveLeave")?"<td>"+actions+"</td>":"") + '</tr>';
      }).join('') : '<tr><td colspan="6" style="color:var(--muted);text-align:center;padding:20px;">Tidak ada data cuti</td></tr>') +
      '</table></div></div>';

    el.innerHTML = html;
    document.getElementById("new-leave-btn").onclick = openLeaveModal;
  }

  window.approveLeave = function(id){
    api("/rest/v1/leave_requests?id=eq."+id, { method:"PATCH", headers:{Prefer:"return=minimal"}, body:{status:"Approved", updated_at:new Date().toISOString()} })
      .then(function(){ loadLeaveRequests(); })
      .catch(function(e){ alert("Gagal menyetujui: " + e.message); });
  };
  window.rejectLeave = function(id){
    api("/rest/v1/leave_requests?id=eq."+id, { method:"PATCH", headers:{Prefer:"return=minimal"}, body:{status:"Rejected", updated_at:new Date().toISOString()} })
      .then(function(){ loadLeaveRequests(); })
      .catch(function(e){ alert("Gagal menolak: " + e.message); });
  };

  // Leave modal
  function openLeaveModal(){
    document.getElementById("leave-modal").classList.add("open");
    document.getElementById("lv-error").textContent = "";
    document.getElementById("lv-submit").onclick = function(){
      var type = document.getElementById("lv-type").value;
      var start = document.getElementById("lv-start").value;
      var end = document.getElementById("lv-end").value;
      var notes = document.getElementById("lv-notes").value;
      if (!start || !end){ document.getElementById("lv-error").textContent = "Tanggal wajib diisi."; return; }
      if (end < start){ document.getElementById("lv-error").textContent = "Tanggal selesai harus setelah tanggal mulai."; return; }
      // Find employee linked to current user
      var emp = state.employees.find(function(e){ return e.institution_email === (state.user&&state.user.email); });
      var payload = { type:type, start_date:start, end_date:end, notes:notes, status:"Pending", created_at:new Date().toISOString() };
      if (emp) payload.employee_id = emp.id;
      api("/rest/v1/leave_requests", { method:"POST", headers:{Prefer:"return=minimal"}, body:payload })
        .then(function(){ closeLeaveModal(); loadLeaveRequests(); })
        .catch(function(e){ document.getElementById("lv-error").textContent = "Gagal: " + e.message; });
    };
  }
  window.closeLeaveModal = function(){
    document.getElementById("leave-modal").classList.remove("open");
  };
  document.getElementById("leave-modal").onclick = function(ev){
    if(ev.target === this) closeLeaveModal();
  };

  /* ================================================================
     EXPORT / IMPORT (.xlsx)
     ================================================================ */
  function renderExportImport(){
    var el = document.getElementById("tab-content");
    var html =
      '<div class="section-title">📁 Export / Import Data</div>' +

      '<div class="grid grid-2">' +
        // EXPORT card
        '<div class="card">' +
          '<h4 style="font-size:14px;font-weight:600;margin-bottom:8px;">⬇ Export ke Excel (.xlsx)</h4>' +
          '<p style="font-size:13px;color:var(--muted);margin-bottom:14px;">Unduh data pegawai atau cuti ke format Excel untuk diolah lebih lanjut.</p>' +
          '<div class="btn-group">' +
            '<button class="btn btn-primary" id="exp-emp">Export Data Pegawai</button>' +
            '<button class="btn" id="exp-leave">Export Data Cuti</button>' +
          '</div>' +
        '</div>' +

        // IMPORT card
        (can("canImport") ?
        '<div class="card">' +
          '<h4 style="font-size:14px;font-weight:600;margin-bottom:8px;">⬆ Import dari Excel (.xlsx)</h4>' +
          '<p style="font-size:13px;color:var(--muted);margin-bottom:8px;">Upload file Excel sesuai template untuk menambah/memperbarui data pegawai.</p>' +
          '<button class="btn" id="dl-template">⬇ Unduh Template</button>' +
          '<div class="field" style="margin-top:12px;"><label>Pilih File Excel</label><input type="file" id="import-file" accept=".xlsx,.xls" style="padding:6px;" /></div>' +
          '<div id="import-preview" style="margin-top:10px;"></div>' +
          '<div id="import-error" class="err"></div>' +
          '<button class="btn btn-primary" id="import-submit" style="margin-top:10px;display:none;">Import Data</button>' +
        '</div>'
        : '<div class="card"><p style="color:var(--muted);font-size:13px;">Import data hanya tersedia untuk Admin.</p></div>') +
      '</div>';

    el.innerHTML = html;

    // Export employees
    document.getElementById("exp-emp").onclick = function(){
      if (!state.employees.length){ alert("Tidak ada data pegawai."); return; }
      var data = state.employees.map(function(e){
        return {
          "No. Pegawai": e.employee_number,
          "Nama Lengkap": e.full_name,
          "NIK": e.nik,
          "Jenis Kelamin": e.gender==="L"?"Laki-laki":e.gender==="P"?"Perempuan":"-",
          "Tempat Lahir": e.birth_place,
          "Tanggal Lahir": e.birth_date,
          "Agama": (e.m_agama&&e.m_agama.nama)||"-",
          "Status Perkawinan": (e.m_status_perkawinan&&e.m_status_perkawinan.nama)||"-",
          "Email": e.institution_email,
          "No. HP": e.mobile_phone,
          "Alamat": e.address,
          "Unit Kerja": (e.m_unit_kerja&&e.m_unit_kerja.nama)||"-",
          "Jabatan": (e.m_jabatan&&e.m_jabatan.nama)||"-",
          "Status Kepegawaian": (e.m_status_kepegawaian&&e.m_status_kepegawaian.nama)||"-",
          "Jenis Kepegawaian": (e.m_jenis_kepegawaian&&e.m_jenis_kepegawaian.nama)||"-",
          "Tanggal Bergabung": e.join_date,
          "Kontrak Berakhir": e.contract_end,
          "Status Aktif": e.active_status?"Aktif":"Nonaktif",
          "Pendidikan Terakhir": e.highest_education,
          "Universitas": e.university,
          "Bank": (e.m_bank&&e.m_bank.nama)||"-",
          "No. Rekening": e.bank_account_number,
          "Gaji Pokok": e.basic_salary,
          "Tunjangan": e.allowances
        };
      });
      downloadXlsx(data, "Data_Pegawai_" + new Date().toISOString().slice(0,10) + ".xlsx", "Pegawai");
    };

    // Export leave
    document.getElementById("exp-leave").onclick = function(){
      if (!state.leaveRequests.length){
        // Try to load first
        api("/rest/v1/leave_requests?select=*,employees(full_name)&order=created_at.desc")
          .then(function(rows){ state.leaveRequests = rows||[]; doExportLeave(); })
          .catch(function(){ doExportLeave(); });
      } else { doExportLeave(); }
    };

    function doExportLeave(){
      if (!state.leaveRequests.length){ alert("Tidak ada data cuti."); return; }
      var data = state.leaveRequests.map(function(r){
        return {
          "Nama Pegawai": (r.employees&&r.employees.full_name)||"-",
          "Jenis Cuti": r.type,
          "Tanggal Mulai": r.start_date,
          "Tanggal Selesai": r.end_date,
          "Status": r.status,
          "Keterangan": r.notes,
          "Dibuat": r.created_at
        };
      });
      downloadXlsx(data, "Data_Cuti_" + new Date().toISOString().slice(0,10) + ".xlsx", "Cuti");
    }

    // Template download
    if (can("canImport")){
      document.getElementById("dl-template").onclick = function(){
        var template = [{ "No. Pegawai":"", "Nama Lengkap":"", "NIK":"", "Jenis Kelamin":"L/P", "Tempat Lahir":"", "Tanggal Lahir":"YYYY-MM-DD", "Email":"", "No. HP":"", "Alamat":"", "Tanggal Bergabung":"YYYY-MM-DD" }];
        downloadXlsx(template, "Template_Import_Pegawai.xlsx", "Template");
      };

      var importedData = null;
      document.getElementById("import-file").onchange = function(ev){
        var file = ev.target.files[0]; if(!file) return;
        var reader = new FileReader();
        reader.onload = function(e){
          try {
            var wb = XLSX.read(e.target.result, {type:"binary"});
            var ws = wb.Sheets[wb.SheetNames[0]];
            var json = XLSX.utils.sheet_to_json(ws);
            importedData = json;
            var prevEl = document.getElementById("import-preview");
            var submitBtn = document.getElementById("import-submit");
            document.getElementById("import-error").textContent = "";
            if (json.length === 0){ prevEl.innerHTML = '<p class="err">File kosong atau format tidak sesuai.</p>'; submitBtn.style.display="none"; return; }
            // Preview first 5 rows
            var keys = Object.keys(json[0]);
            var previewHtml = '<p style="font-size:12px;color:var(--muted);margin-bottom:6px;">Preview ' + Math.min(5,json.length) + ' dari ' + json.length + ' baris:</p>' +
              '<div class="table-wrap"><table><tr>' + keys.slice(0,5).map(function(k){ return '<th>'+escHtml(k)+'</th>'; }).join('') + '</tr>' +
              json.slice(0,5).map(function(row){ return '<tr>' + keys.slice(0,5).map(function(k){ return '<td>'+escHtml(String(row[k]||''))+'</td>'; }).join('') + '</tr>'; }).join('') + '</table></div>';
            prevEl.innerHTML = previewHtml;
            submitBtn.style.display = "inline-flex";
          } catch(err){ document.getElementById("import-error").textContent = "Error membaca file: " + err.message; }
        };
        reader.readAsBinaryString(file);
      };

      document.getElementById("import-submit").onclick = function(){
        if (!importedData || !importedData.length){ return; }
        var btn = document.getElementById("import-submit");
        btn.disabled = true; btn.textContent = "⏳ Mengimpor...";
        var errEl = document.getElementById("import-error");
        // Map and upsert rows
        var rows = importedData.map(function(r){
          return {
            employee_number: r["No. Pegawai"] || null,
            full_name: r["Nama Lengkap"] || null,
            nik: r["NIK"] ? String(r["NIK"]) : null,
            gender: r["Jenis Kelamin"]==="Laki-laki"?"L": r["Jenis Kelamin"]==="Perempuan"?"P": (r["Jenis Kelamin"]||null),
            birth_place: r["Tempat Lahir"] || null,
            birth_date: r["Tanggal Lahir"] || null,
            institution_email: r["Email"] || null,
            mobile_phone: r["No. HP"] ? String(r["No. HP"]) : null,
            address: r["Alamat"] || null,
            join_date: r["Tanggal Bergabung"] || null,
            updated_at: new Date().toISOString()
          };
        }).filter(function(r){ return r.full_name; });
        if (!rows.length){ errEl.textContent = "Tidak ada baris valid ditemukan."; btn.disabled=false; btn.textContent="Import Data"; return; }
        api("/rest/v1/employees", { method:"POST", headers:{ Prefer:"resolution=merge-duplicates,return=minimal" }, body: rows })
          .then(function(){
            errEl.style.color = "var(--badge-green-fg)";
            errEl.textContent = "✓ " + rows.length + " baris berhasil diimpor!";
            btn.disabled=false; btn.textContent="Import Data";
            loadAll();
          })
          .catch(function(e){ errEl.style.color=""; errEl.textContent = "Gagal import: " + e.message; btn.disabled=false; btn.textContent="Import Data"; });
      };
    }
  }

  function downloadXlsx(data, filename, sheetName){
    var ws = XLSX.utils.json_to_sheet(data);
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, sheetName || "Data");
    XLSX.writeFile(wb, filename);
  }

  /* ================================================================
     BIODATA LIST
     ================================================================ */
  function renderBiodata(){
    var el = document.getElementById("tab-content");
    if (state.loading){ el.innerHTML = '<div class="loading-spinner"><div class="spinner"></div> Memuat data...</div>'; return; }
    if (state.selectedEmployeeId){ renderBiodataDetail(el); return; }

    el.innerHTML =
      '<div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;">' +
        '<div class="searchbar" style="flex:1;margin-bottom:0;"><input id="search-emp" placeholder="Cari nama atau nomor pegawai..." /></div>' +
        (can("canExport") ? '<button class="btn btn-sm" id="quick-export-emp">⬇ Excel</button>' : '') +
      '</div>' +
      '<div class="card"><div class="table-wrap"><table id="emp-table"></table></div></div>';

    function drawRows(filter){
      var rows = state.employees.filter(function(e){
        if(!filter) return true;
        var f = filter.toLowerCase();
        return (e.full_name||"").toLowerCase().indexOf(f)>=0 || (e.employee_number||"").toLowerCase().indexOf(f)>=0;
      });
      var t = document.getElementById("emp-table");
      t.innerHTML = '<tr><th>No. Pegawai</th><th>Nama</th><th>Jabatan</th><th>Unit Kerja</th><th>Status</th><th></th></tr>' +
        rows.map(function(e){
          return '<tr><td>' + escHtml(e.employee_number||"-") + '</td><td><b>' + escHtml(e.full_name) + '</b></td><td>' + escHtml((e.m_jabatan&&e.m_jabatan.nama)||"-") + '</td><td>' + escHtml((e.m_unit_kerja&&e.m_unit_kerja.nama)||"-") + '</td><td>' + (e.active_status?'<span class="badge badge-green">Aktif</span>':'<span class="badge badge-gray">Nonaktif</span>') + '</td><td><span class="link" data-id="' + e.id + '">Lihat →</span></td></tr>';
        }).join('');
      Array.prototype.forEach.call(t.querySelectorAll("[data-id]"), function(s){
        s.onclick = function(){ state.selectedEmployeeId = s.getAttribute("data-id"); state.editing=false; render(); };
      });
    }
    drawRows("");
    document.getElementById("search-emp").oninput = function(e){ drawRows(e.target.value); };
    if (can("canExport")){
      var qe = document.getElementById("quick-export-emp");
      if(qe) qe.onclick = function(){
        if (!state.employees.length){ alert("Tidak ada data."); return; }
        var data = state.employees.map(function(e){ return { "No. Pegawai":e.employee_number,"Nama":e.full_name,"Jabatan":(e.m_jabatan&&e.m_jabatan.nama)||"-","Unit Kerja":(e.m_unit_kerja&&e.m_unit_kerja.nama)||"-","Status":e.active_status?"Aktif":"Nonaktif" }; });
        downloadXlsx(data, "Daftar_Pegawai.xlsx", "Pegawai");
      };
    }
  }

  function opts(list, valueField, labelField, selected){
    return '<option value="">-</option>' + list.map(function(o){
      return '<option value="' + o[valueField] + '" ' + (o[valueField]===selected?'selected':'') + '>' + escHtml(o[labelField]) + '</option>';
    }).join('');
  }

  function renderBiodataDetail(el){
    var e = state.employees.find(function(x){ return x.id===state.selectedEmployeeId; });
    if (!e){ state.selectedEmployeeId=null; renderBiodata(); return; }
    var edit = state.editing;
    var m = state.masters;
    var reviews = state.reviews.filter(function(r){ return r.employee_id===e.id; });
    var teach = (state.teaching||[]).find(function(t){ return t.employee_id===e.id; });

    function row(label, viewVal, editHtml){
      return '<div class="field"><label>' + escHtml(label) + '</label>' + (edit ? editHtml : '<div style="padding:5px 0;font-size:13px;">' + escHtml(viewVal===undefined||viewVal===null||viewVal===""?"-":String(viewVal)) + '</div>') + '</div>';
    }
    function inp(id, val, type){ return '<input id="' + id + '" type="' + (type||'text') + '" value="' + escHtml(val===null||val===undefined?"":String(val)) + '" />'; }

    var html = '<div style="margin-bottom:10px;"><span class="link" id="back-link">← Kembali ke daftar</span></div>';
    html += '<div class="card">';
    html += '<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;margin-bottom:12px;">' +
      '<div><h2 style="font-size:18px;font-weight:700;">' + escHtml(e.full_name) + '</h2><p style="color:var(--muted);font-size:13px;">' + escHtml(e.employee_number||"-") + ' · ' + escHtml((e.m_jabatan&&e.m_jabatan.nama)||"-") + '</p></div>' +
      (can("canEdit") ? '<button class="btn ' + (edit?'':'btn-primary') + '" id="edit-toggle">' + (edit?'✕ Batal':'✎ Edit Data') + '</button>' : '') +
    '</div>';

    html += '<div class="section-title">Identitas Pribadi</div><div class="grid grid-2">' +
      row("NIK", e.nik, inp("ed-nik", e.nik)) +
      row("NUPTK", e.nuptk, inp("ed-nuptk", e.nuptk)) +
      row("Jenis Kelamin", e.gender==="L"?"Laki-laki":e.gender==="P"?"Perempuan":"-", '<select id="ed-gender"><option value="">-</option><option value="L" '+(e.gender==="L"?"selected":"")+'>Laki-laki</option><option value="P" '+(e.gender==="P"?"selected":"")+'>Perempuan</option></select>') +
      row("Tempat Lahir", e.birth_place, inp("ed-birthplace", e.birth_place)) +
      row("Tanggal Lahir", fmtDate(e.birth_date), inp("ed-birthdate", e.birth_date, "date")) +
      row("Agama", (e.m_agama&&e.m_agama.nama)||"-", '<select id="ed-agama">'+opts(m.agama,"id","nama",e.agama_id)+'</select>') +
      row("Status Perkawinan", (e.m_status_perkawinan&&e.m_status_perkawinan.nama)||"-", '<select id="ed-kawin">'+opts(m.kawin,"id","nama",e.status_perkawinan_id)+'</select>') +
    '</div>';

    html += '<div class="section-title">Kontak</div><div class="grid grid-2">' +
      row("No. HP", e.mobile_phone, inp("ed-mobile", e.mobile_phone)) +
      row("Email Institusi", e.institution_email, inp("ed-email", e.institution_email)) +
      row("Alamat", e.address, inp("ed-address", e.address)) +
      row("Provinsi / Kab.", (e.province||"-")+" / "+(e.regency||"-"), inp("ed-regency", e.regency)) +
    '</div>';

    html += '<div class="section-title">Kepegawaian</div><div class="grid grid-2">' +
      row("Status Kepegawaian", (e.m_status_kepegawaian&&e.m_status_kepegawaian.nama)||"-", '<select id="ed-statuskp">'+opts(m.statusKp,"id","nama",e.status_kepegawaian_id)+'</select>') +
      row("Jenis Kepegawaian", (e.m_jenis_kepegawaian&&e.m_jenis_kepegawaian.nama)||"-", '<select id="ed-jeniskp">'+opts(m.jenisKp,"id","nama",e.jenis_kepegawaian_id)+'</select>') +
      row("Unit Kerja", (e.m_unit_kerja&&e.m_unit_kerja.nama)||"-", '<select id="ed-unit">'+opts(m.unit,"id","nama",e.unit_kerja_id)+'</select>') +
      row("Jabatan", (e.m_jabatan&&e.m_jabatan.nama)||"-", '<select id="ed-jabatan">'+opts(m.jabatan,"id","nama",e.jabatan_id)+'</select>') +
      row("Tanggal Bergabung", fmtDate(e.join_date), inp("ed-join", e.join_date, "date")) +
      row("Kontrak Berakhir", fmtDate(e.contract_end), inp("ed-contractend", e.contract_end, "date")) +
      row("Status Aktif", e.active_status?"Aktif":"Nonaktif", '<select id="ed-active"><option value="true" '+(e.active_status?"selected":"")+'>Aktif</option><option value="false" '+(!e.active_status?"selected":"")+'>Nonaktif</option></select>') +
    '</div>';

    html += '<div class="section-title">Akademik</div><div class="grid grid-2">' +
      row("Pendidikan Terakhir", e.highest_education, inp("ed-edu", e.highest_education)) +
      row("Universitas", e.university, inp("ed-univ", e.university)) +
    '</div>';

    html += '<div class="section-title">Payroll</div><div class="grid grid-2">' +
      row("Bank", (e.m_bank&&e.m_bank.nama)||"-", '<select id="ed-bank">'+opts(m.bank,"id","nama",e.bank_id)+'</select>') +
      row("No. Rekening", e.bank_account_number, inp("ed-rek", e.bank_account_number)) +
      row("Gaji Pokok", fmtMoney(e.basic_salary), inp("ed-gaji", e.basic_salary, "number")) +
      row("Tunjangan", fmtMoney(e.allowances), inp("ed-tunj", e.allowances, "number")) +
    '</div>';

    if (teach){
      html += '<div class="section-title">Penugasan Mengajar</div><div class="grid grid-2">' +
        row("Mata Pelajaran", teach.subject) + row("Kelas/Jenjang", teach.grade_level) +
        row("Wali Kelas", teach.is_homeroom_teacher?"Ya":"Tidak") + row("Guru Tahfizh", teach.is_tahfizh_teacher?"Ya":"Tidak") +
      '</div>';
    }

    html += '<div class="section-title">Riwayat Penilaian Kinerja</div>';
    if (reviews.length===0){ html += '<p style="color:var(--muted);font-size:13px;">Belum ada riwayat penilaian.</p>'; }
    else {
      html += '<div class="table-wrap"><table><tr><th>Periode</th><th>Skor Total</th><th>Predikat</th><th>Rekomendasi</th></tr>' +
        reviews.map(function(r){
          var cls = (r.predikat==="Sangat Baik"||r.predikat==="Baik")?"badge-green":r.predikat==="Cukup"?"badge-amber":"badge-red";
          return '<tr><td>' + escHtml(r.review_period||"-") + '</td><td>' + escHtml(String(r.score_total||"-")) + '</td><td><span class="badge ' + cls + '">' + escHtml(r.predikat||"-") + '</span></td><td>' + escHtml(r.rekomendasi||"-") + '</td></tr>';
        }).join('') + '</table></div>';
    }

    if (edit){ html += '<div style="margin-top:16px;"><button class="btn btn-primary" id="save-btn">💾 Simpan Perubahan</button></div>'; }
    html += '</div>';

    el.innerHTML = html;
    document.getElementById("back-link").onclick = function(){ state.selectedEmployeeId=null; state.editing=false; render(); };
    if (can("canEdit")){
      document.getElementById("edit-toggle").onclick = function(){ state.editing = !state.editing; render(); };
    }
    if (edit){
      document.getElementById("save-btn").onclick = function(){
        function val(id){ var elx=document.getElementById(id); return elx?elx.value:""; }
        var payload = {
          nik: val("ed-nik"), nuptk: val("ed-nuptk"), gender: val("ed-gender")||null,
          birth_place: val("ed-birthplace"), birth_date: val("ed-birthdate")||null,
          agama_id: val("ed-agama")||null, status_perkawinan_id: val("ed-kawin")||null,
          mobile_phone: val("ed-mobile"), institution_email: val("ed-email"), address: val("ed-address"), regency: val("ed-regency"),
          status_kepegawaian_id: val("ed-statuskp")||null, jenis_kepegawaian_id: val("ed-jeniskp")||null,
          unit_kerja_id: val("ed-unit")||null, jabatan_id: val("ed-jabatan")||null,
          join_date: val("ed-join")||null, contract_end: val("ed-contractend")||null, active_status: val("ed-active")==="true",
          highest_education: val("ed-edu"), university: val("ed-univ"),
          bank_id: val("ed-bank")||null, bank_account_number: val("ed-rek"),
          basic_salary: val("ed-gaji")?Number(val("ed-gaji")):null,
          allowances: val("ed-tunj")?Number(val("ed-tunj")):null,
          updated_at: new Date().toISOString()
        };
        api("/rest/v1/employees?id=eq."+e.id, { method:"PATCH", headers:{ Prefer:"return=minimal" }, body: payload })
          .then(function(){ state.editing=false; loadAll(); })
          .catch(function(err){ alert("Gagal menyimpan: " + err.message); });
      };
    }
  }

  /* ================================================================
     INITIAL RENDER
     ================================================================ */
  render();

})();
</script>
