<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sistem Informasi Kepegawaian Pesantren Modern Al-Falah Abu Lam U" />
  <title>HRIS Al-Falah</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0E505A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="HRIS Al-Falah" />

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Philosopher:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- SheetJS for Excel Export/Import -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <!-- Chart.js for Analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <!-- Supabase JS SDK -- used ONLY for the Realtime notification listener
       (Fitur 1). Everything else in this app deliberately stays on raw
       fetch() calls to the REST API, per the project's existing "no heavy
       SDK" design -- Realtime's WebSocket/Phoenix-channel protocol is
       complex enough that hand-rolling it would be a real correctness
       risk I can't fully verify without a live server to test against. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <style>
    /* ============================================================
       CSS CUSTOM PROPERTIES — LIGHT & DARK THEMES
       ============================================================ */
    :root {
      --brand-dark:    #0E505A;
      --brand-mid:     #3F8D58;
      --brand-light:   #7DD857;
      --brand-accent:  #50A158;

      /* Surfaces */
      --bg:            #f4f7f5;
      --surface:       #ffffff;
      --surface-2:     #f9fbfa;
      --border:        #e3e3e0;
      --border-strong: #c8d3cf;

      /* Text */
      --ink:           #16302C;
      --ink-2:         #2e4e48;
      --muted:         #5b6b66;
      --muted-2:       #8a9e99;

      /* Metrics */
      --metric-bg:     #f0f7f2;

      /* Badges */
      --badge-green-bg: #e3f5e3; --badge-green-fg: #1e7d1e;
      --badge-amber-bg: #fdf1de; --badge-amber-fg: #8a5a10;
      --badge-red-bg:   #fde3e3; --badge-red-fg:   #a02020;
      --badge-gray-bg:  #eeeeee; --badge-gray-fg:   #666666;
      --badge-blue-bg:  #deedf9; --badge-blue-fg:   #1a5a8a;

      /* Shadows */
      --shadow-sm:  0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
      --shadow-md:  0 4px 12px rgba(0,0,0,.08);

      /* Transitions */
      --transition: all 0.2s ease;
    }

    [data-theme="dark"] {
      --bg:            #0f1a18;
      --surface:       #1a2e2a;
      --surface-2:     #223330;
      --border:        #2e4440;
      --border-strong: #3a5550;

      --ink:           #e8f0ee;
      --ink-2:         #c4d8d4;
      --muted:         #8aada8;
      --muted-2:       #5f8680;

      --metric-bg:     #1e3530;

      --badge-green-bg: #1a3a1a; --badge-green-fg: #6dd46d;
      --badge-amber-bg: #3a2a10; --badge-amber-fg: #e0a040;
      --badge-red-bg:   #3a1a1a; --badge-red-fg:   #e06060;
      --badge-gray-bg:  #2a2a2a; --badge-gray-fg:  #aaaaaa;
      --badge-blue-bg:  #1a2a3a; --badge-blue-fg:  #60a8e0;

      --shadow-sm:  0 1px 3px rgba(0,0,0,.3);
      --shadow-md:  0 4px 12px rgba(0,0,0,.4);
    }

    /* ============================================================
       RESET & BASE
       ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--ink);
      font-size: 14px;
      line-height: 1.5;
      transition: background 0.3s ease, color 0.3s ease;
      padding: 12px;
      min-height: 100vh;
    }

    /* ============================================================
       HEADER BANNER
       ============================================================ */
    .hb {
      background: linear-gradient(135deg, #0E505A 0%, #2E7859 40%, #50A158 70%, #7DD857 100%);
      border-radius: 14px;
      padding: 1.25rem 1.5rem;
      color: #fff;
      margin-bottom: 1rem;
      box-shadow: var(--shadow-md);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .hb h1 {
      font-family: 'Philosopher', serif;
      font-weight: 700;
      font-size: 18px;
      letter-spacing: .3px;
    }
    .hb p { font-size: 12px; opacity: .88; margin-top: 3px; }

    .hb-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    /* ============================================================
       DARK MODE TOGGLE
       ============================================================ */
    .dm-toggle {
      width: 42px; height: 24px;
      background: rgba(255,255,255,0.25);
      border-radius: 12px;
      border: 1.5px solid rgba(255,255,255,0.5);
      cursor: pointer;
      position: relative;
      transition: var(--transition);
      flex-shrink: 0;
    }
    .dm-toggle::after {
      content: '';
      position: absolute;
      top: 2px; left: 2px;
      width: 16px; height: 16px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.2s ease;
    }
    [data-theme="dark"] .dm-toggle { background: rgba(125,216,87,0.4); border-color: rgba(125,216,87,0.7); }
    [data-theme="dark"] .dm-toggle::after { transform: translateX(18px); }

    .dm-icon { font-size: 14px; line-height: 1; }

    /* ============================================================
       CARDS
       ============================================================ */
    .card {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    /* ============================================================
       GRID
       ============================================================ */
    .grid { display: grid; gap: 12px; }
    .grid-2 { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
    .grid-3 { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
    .grid-4 { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }

    /* ============================================================
       METRICS
       ============================================================ */
    .metric {
      background: var(--metric-bg);
      border-radius: 10px;
      padding: 1rem 1.1rem;
      transition: background 0.3s ease;
    }
    .metric .lbl { font-size: 11px; color: var(--muted); margin-bottom: 6px; font-weight: 500; text-transform: uppercase; letter-spacing: .4px; }
    .metric .val { font-size: 24px; font-weight: 700; color: var(--brand-dark); }
    [data-theme="dark"] .metric .val { color: var(--brand-light); }
    .metric .trend { font-size: 11px; color: var(--muted); margin-top: 2px; }

    /* ============================================================
       BUTTONS
       ============================================================ */
    .btn {
      border: 0.5px solid var(--border-strong);
      background: var(--surface);
      color: var(--ink);
      border-radius: 8px;
      padding: 7px 14px;
      font-size: 13px;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }
    .btn:hover { background: var(--surface-2); box-shadow: var(--shadow-sm); }
    .btn-primary { background: var(--brand-dark); color: #fff; border-color: transparent; }
    .btn-primary:hover { background: #0a3d45; }
    .btn-success { background: #1e7d1e; color: #fff; border-color: transparent; }
    .btn-success:hover { background: #165a16; }
    .btn-danger { background: #a02020; color: #fff; border-color: transparent; }
    .btn-danger:hover { background: #7a1818; }
    .btn-sm { padding: 4px 10px; font-size: 12px; border-radius: 6px; }
    .btn-icon { padding: 6px 10px; }

    .btn-group { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

    /* ============================================================
       TABS
       ============================================================ */
    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      padding: 7px 15px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: 0.5px solid transparent;
      white-space: nowrap;
      transition: var(--transition);
      color: var(--muted);
    }
    .tab:hover { background: var(--surface); color: var(--ink); }
    .tab.active { background: var(--brand-dark); color: #fff; box-shadow: var(--shadow-sm); }

    /* ============================================================
       FORM ELEMENTS
       ============================================================ */
    input, select, textarea {
      width: 100%;
      padding: 7px 10px;
      border: 0.5px solid var(--border-strong);
      border-radius: 7px;
      font-size: 13px;
      font-family: inherit;
      background: var(--surface);
      color: var(--ink);
      transition: var(--transition);
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--brand-dark);
      box-shadow: 0 0 0 3px rgba(14, 80, 90, 0.12);
    }
    label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 3px; font-weight: 500; }
    .field { margin-bottom: 10px; }

    /* ============================================================
       TABLE
       ============================================================ */
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 9px 8px; border-bottom: 0.5px solid var(--border); }
    th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .4px; background: var(--surface-2); }
    tr:hover td { background: var(--metric-bg); }
    td { color: var(--ink-2); }
    .table-wrap { overflow-x: auto; border-radius: 8px; }

    /* ============================================================
       BADGES
       ============================================================ */
    .badge {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .2px;
    }
    .badge-green { background: var(--badge-green-bg); color: var(--badge-green-fg); }
    .badge-amber { background: var(--badge-amber-bg); color: var(--badge-amber-fg); }
    .badge-red   { background: var(--badge-red-bg);   color: var(--badge-red-fg);   }
    .badge-gray  { background: var(--badge-gray-bg);  color: var(--badge-gray-fg);  }
    .badge-blue  { background: var(--badge-blue-bg);  color: var(--badge-blue-fg);  }

    /* ============================================================
       MISC UTILITIES
       ============================================================ */
    .link { color: var(--brand-dark); cursor: pointer; text-decoration: underline; }
    [data-theme="dark"] .link { color: var(--brand-light); }
    .err { color: var(--badge-red-fg); font-size: 13px; margin: 6px 0; }
    .section-title {
      font-weight: 700;
      font-size: 12px;
      color: var(--brand-dark);
      margin: 16px 0 8px;
      border-bottom: 1.5px solid var(--border);
      padding-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    [data-theme="dark"] .section-title { color: var(--brand-light); }
    .searchbar { margin-bottom: 12px; position: relative; }
    .searchbar input { padding-left: 32px; }
    .searchbar::before { content: '🔍'; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 12px; }

    .loading-spinner {
      display: flex; align-items: center; gap: 10px;
      color: var(--muted); padding: 24px 0; font-size: 13px;
    }
    .spinner {
      width: 20px; height: 20px;
      border: 2.5px solid var(--border-strong);
      border-top-color: var(--brand-dark);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* PWA install banner */
    #install-banner {
      display: none;
      background: linear-gradient(90deg, var(--brand-dark), var(--brand-mid));
      color: #fff;
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 10px;
      font-size: 13px;
      align-items: center;
      gap: 10px;
      justify-content: space-between;
    }
    #install-banner.visible { display: flex; }

    /* Online/offline indicator */
    #offline-badge {
      display: none;
      background: var(--badge-amber-bg);
      color: var(--badge-amber-fg);
      border-radius: 6px;
      padding: 3px 10px;
      font-size: 12px;
      font-weight: 600;
    }
    body.offline #offline-badge { display: inline-block; }

    /* Chart container */
    .chart-wrap {
      position: relative;
      height: 220px;
    }

    /* Role badge in header */
    .role-pill {
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 11px;
      font-weight: 600;
      color: #fff;
    }

    /* Analytics tab */
    .analytics-card {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      box-shadow: var(--shadow-sm);
    }
    .analytics-card h4 { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 10px; text-transform: uppercase; letter-spacing:.4px; }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface);
      border-radius: 14px;
      padding: 1.5rem;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow-md);
    }
    .modal h3 { font-size: 16px; font-weight: 700; margin-bottom: 14px; color: var(--ink); }
    .modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

    /* Responsive */
    @media (max-width: 600px) {
      body { padding: 8px; }
      .hb { padding: 1rem; }
      .hb h1 { font-size: 15px; }
    }

    /* ===== FITUR 2: Role-Based UI Customization =====
       [data-role] on <html> is kept in sync with the session (see
       syncRoleAttribute()). These utility classes let any element declare
       "only show me for role X" purely in markup, no per-element JS needed. */
    .role-admin-only, .role-hrd-only, .role-pimpinan-only { display: none; }
    html[data-role="admin"] .role-admin-only { display: revert; }
    html[data-role="hrd_staff"] .role-hrd-only { display: revert; }
    html[data-role="pimpinan"] .role-pimpinan-only { display: revert; }
    html[data-role="pimpinan"] .role-hide-pimpinan,
    html[data-role="hrd_staff"] .role-hide-hrd { display: none !important; }
  </style>
</head>
<body>

<!-- PWA Install Banner -->
<div id="install-banner">
  <span>📱 Install HRIS Al-Falah sebagai aplikasi</span>
  <div style="display:flex;gap:6px;">
    <button class="btn btn-sm" style="background:rgba(255,255,255,0.9);color:#0E505A;font-weight:700;" id="install-btn">Install</button>
    <button class="btn btn-sm" style="background:transparent;border-color:rgba(255,255,255,0.5);color:#fff;" id="install-dismiss">✕</button>
  </div>
</div>

<div id="hris-root"></div>

<!-- Leave Request Modal -->
<div class="modal-overlay" id="leave-modal">
  <div class="modal">
    <h3>📋 Ajukan Cuti / Izin</h3>
    <div class="field">
      <label>Jenis</label>
      <select id="lv-type">
        <option value="Cuti Tahunan">Cuti Tahunan</option>
        <option value="Cuti Sakit">Cuti Sakit</option>
        <option value="Cuti Melahirkan">Cuti Melahirkan</option>
        <option value="Izin Khusus">Izin Khusus</option>
        <option value="Cuti Lainnya">Cuti Lainnya</option>
      </select>
    </div>
    <div class="grid grid-2">
      <div class="field"><label>Tanggal Mulai</label><input type="date" id="lv-start" /></div>
      <div class="field"><label>Tanggal Selesai</label><input type="date" id="lv-end" /></div>
    </div>
    <div class="field"><label>Keterangan</label><textarea id="lv-notes" rows="3" style="resize:vertical;"></textarea></div>
    <div id="lv-error" class="err"></div>
    <div class="modal-footer">
      <button class="btn" onclick="closeLeaveModal()">Batal</button>
      <button class="btn btn-primary" id="lv-submit">Kirim Pengajuan</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="event-modal">
  <div class="modal">
    <h3 id="ev-modal-title">🏫 Jadwal Kegiatan Lembaga</h3>
    <div class="field"><label>Nama Kegiatan</label><input type="text" id="ev-title" /></div>
    <div class="field">
      <label>Kategori</label>
      <select id="ev-category">
        <option value="Akademik">Akademik</option>
        <option value="Keagamaan">Keagamaan</option>
        <option value="Administrasi">Administrasi</option>
        <option value="Umum">Umum</option>
      </select>
    </div>
    <div class="grid grid-2">
      <div class="field"><label>Tanggal Mulai</label><input type="date" id="ev-start" /></div>
      <div class="field"><label>Tanggal Selesai</label><input type="date" id="ev-end" /></div>
    </div>
    <div class="field"><label>Deskripsi (opsional)</label><textarea id="ev-desc" rows="3" style="resize:vertical;"></textarea></div>
    <div id="ev-error" class="err"></div>
    <div class="modal-footer">
      <button class="btn" id="ev-delete-btn" style="display:none;margin-right:auto;color:var(--badge-red-fg);border-color:var(--badge-red-fg);">🗑 Hapus</button>
      <button class="btn" onclick="closeEventModal()">Batal</button>
      <button class="btn btn-primary" id="ev-save-btn">💾 Simpan</button>
    </div>
  </div>
</div>


<script>
(function(){
  /* ================================================================
     CONFIG & STATE
     ================================================================ */
  var SUPABASE_URL = "https://tnqeicxwxwtufuglxmdb.supabase.co";
  var ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRucWVpY3h3eHd0dWZ1Z2x4bWRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3NDMxNTksImV4cCI6MjEwMTMxOTE1OX0.QmH_sZ3fv6rywlCqj5cmX1VDjQHYTeOr7psAp7GMIKg";

  var state = {
    session: null, user: null, role: null, fullName: null,
    view: "login", authMode: "login",
    employees: [], masters: {}, reviews: [], leaveRequests: [],
    selectedEmployeeId: null, editing: false, loading: false, errorMsg: "",
    teaching: [], history: [],
    chartInstances: {},
    calendarYear: null, calendarMonth: null, selfEditing: false,
    realtimeChannel: null, realtimeClient: null,
    // batch2 module records (employee_contacts, employee_bank_accounts, ...),
    // keyed by employee id then module key -- fetched lazily per employee
    // (13 extra tables x every employee would be wasteful on the main list).
    childRecords: {}, childFormOpen: null, _loadingChild: {}
  };

  /* ================================================================
     ROLE PERMISSIONS
     ================================================================ */
  var ROLE_CONFIG = {
    admin: {
      label: "Admin",
      tabs: ["dashboard", "analytics", "calendar", "biodata", "leave_management", "notifications", "export_import"],
      canEdit: true, canApproveLeave: true, canExport: true, canImport: true,
      canManageRoles: true, canViewSalary: true, canViewDisciplinary: true, canManageEvents: true
    },
    hrd_staff: {
      label: "Staf HRD",
      tabs: ["dashboard", "analytics", "calendar", "biodata", "leave_management", "notifications", "export_import"],
      canEdit: true, canApproveLeave: true, canExport: true, canImport: false,
      canManageRoles: false, canViewSalary: false, canViewDisciplinary: false, canManageEvents: false
    },
    pimpinan: {
      label: "Pimpinan",
      tabs: ["dashboard", "analytics", "calendar", "biodata", "notifications"],
      canEdit: false, canApproveLeave: false, canExport: true, canImport: false,
      canManageRoles: false, canViewSalary: false, canViewDisciplinary: false, canManageEvents: false
    }
  };

  function roleConfig(){ return ROLE_CONFIG[state.role] || { label: state.role, tabs:["dashboard"], canEdit:false, canApproveLeave:false, canExport:false, canImport:false, canViewSalary:false, canViewDisciplinary:false, canManageEvents:false }; }
  function can(perm){ return !!roleConfig()[perm]; }
  function hasTab(tab){ return (roleConfig().tabs || []).indexOf(tab) >= 0; }
  // FITUR 2 (Role-Based UI Customization): keeps a data-role attribute on
  // <html> in sync with the logged-in role, so CSS alone can show/hide
  // elements per role via `[data-role="..."] .role-admin-only { display:none }`
  // -- see the .role-*-only utility classes in the stylesheet. This mirrors
  // what RLS already enforces server-side (e.g. canViewSalary/canViewDisciplinary
  // above match the admin-only RLS on payroll/salary_history/punishment), so
  // the UI doesn't show a control that would just fail or return nothing.
  function syncRoleAttribute(){ document.documentElement.setAttribute('data-role', state.role || 'none'); }

  /* ================================================================
     DARK MODE
     ================================================================ */
  function getTheme(){ return localStorage.getItem('hris-theme') || 'light'; }
  function applyTheme(t){
    document.documentElement.setAttribute('data-theme', t);
    localStorage.setItem('hris-theme', t);
    // Update Chart.js defaults for dark mode
    if (window.Chart) {
      var isDark = t === 'dark';
      Chart.defaults.color = isDark ? '#8aada8' : '#5b6b66';
      Chart.defaults.borderColor = isDark ? '#2e4440' : '#e3e3e0';
    }
  }
  function toggleTheme(){
    applyTheme(getTheme() === 'dark' ? 'light' : 'dark');
  }
  // Apply on load
  applyTheme(getTheme());

  /* ================================================================
     PWA
     ================================================================ */
  var deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById('install-banner').classList.add('visible');

  /* ================================================================
     FITUR 1 (client side): Supabase Realtime listener for live
     notifications. NOTE ON TESTING: this connects to a live WebSocket
     endpoint on your actual Supabase project -- nothing in this sandbox
     can open that connection, so this is verified for JS syntax
     correctness and defensive behavior (never throwing if the SDK isn't
     loaded or the user isn't authenticated) but NOT for an actual live
     round-trip. Verify on your real project: open two browser sessions
     (one admin, one hrd_staff), submit a leave request in one, and the
     other should see the notification badge update without a manual
     refresh.
     ================================================================ */
  function initRealtimeNotifications(){
    if (!window.supabase || !state.session || !state.user) return;
    teardownRealtimeNotifications();
    try {
      state.realtimeClient = window.supabase.createClient(SUPABASE_URL, ANON_KEY);
      state.realtimeClient.realtime.setAuth(state.session.access_token);
      state.realtimeChannel = state.realtimeClient
        .channel("notifications-" + state.user.id)
        .on("postgres_changes", { event: "INSERT", schema: "public", table: "notifications" }, function(payload){
          // The realtime socket carries the same JWT as REST calls, so RLS
          // (rls_policies.sql + batch2/3: admin/hrd_staff/pimpinan only)
          // already restricts which INSERTs this client is even shown --
          // no extra client-side role filtering needed here.
          showNotificationToast(payload.new);
          if (state.session && state.view === "notifications"){ render(); }
        })
        .subscribe();
    } catch (e){
      console.warn("Realtime notifications unavailable:", e.message);
    }
  }
  function teardownRealtimeNotifications(){
    if (state.realtimeChannel){ try { state.realtimeChannel.unsubscribe(); } catch(e){} state.realtimeChannel = null; }
    state.realtimeClient = null;
  }
  function showNotificationToast(n){

    box.appendChild(toast);

  /* ================================================================
     INTEGRASI HARI LIBUR/PENTING INDONESIA
     Sumber: guangrei/APIHariLibur_V2 (GitHub, GPL-3.0, auto-updated dari
     Google Calendar). Diambil saat runtime lewat fetch() -- tidak
     menyalin kode sumbernya, jadi tidak mewarisi lisensi GPL ke aplikasi
     ini. Hanya mencakup tahun berjalan (lihat catatan di file sumbernya);
     kalau pengguna menavigasi ke tahun lain, sel kalender untuk tahun itu
     sederhananya tidak mendapat tanda hari libur -- bukan error.
     ================================================================ */
  var HOLIDAY_SOURCE_URL = "https://raw.githubusercontent.com/guangrei/APIHariLibur_V2/main/calendar.min.json";
  var HOLIDAY_CACHE_KEY = "hris-holiday-cache-v1";
  var HOLIDAY_CACHE_MAX_AGE_MS = 24 * 60 * 60 * 1000;

  function parseHolidayData(raw){
    var out = {};
    Object.keys(raw || {}).forEach(function(key){
      if (key === "info") return;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(key)) return;
      var v = raw[key];
      out[key] = {
        holiday: !!v.holiday,
        summary: (v.summary && v.summary.length) ? v.summary.join(", ") : "",
        description: (v.description && v.description.length) ? v.description.join(", ") : ""
      };
    });
    return out;
  }
  function getCachedHolidays(now){
    now = now || Date.now();
    try {
      var raw = localStorage.getItem(HOLIDAY_CACHE_KEY);
      if (!raw) return null;
      var parsed = JSON.parse(raw);
      if (!parsed || typeof parsed.fetchedAt !== "number" || !parsed.data) return null;
      if (now - parsed.fetchedAt > HOLIDAY_CACHE_MAX_AGE_MS) return null;
      return parsed.data;
    } catch (e){ return null; }
  }
  function setCachedHolidays(data){
    try { localStorage.setItem(HOLIDAY_CACHE_KEY, JSON.stringify({ fetchedAt: Date.now(), data: data })); } catch (e){}
  }
  function loadHolidays(){
    var cached = getCachedHolidays();
    if (cached) return Promise.resolve(cached);
    return fetch(HOLIDAY_SOURCE_URL).then(function(res){
      if (!res.ok) throw new Error("status " + res.status);
      return res.json();
    }).then(function(raw){
      var parsed = parseHolidayData(raw);
      setCachedHolidays(parsed);
      return parsed;
    }).catch(function(e){
      console.warn("Gagal memuat data hari libur (kalender tetap jalan tanpa tanda hari libur):", e.message);
      return {}; // graceful degradation -- the calendar itself must never break because of this
    });
  }

  function pad2(n){ return n < 10 ? "0"+n : ""+n; }
  function ymdStr(y, m, d){ return y + "-" + pad2(m+1) + "-" + pad2(d); }
  function daysInMonth(y, m){ return new Date(y, m+1, 0).getDate(); }
  function mondayIndex(y, m, d){ return (new Date(y, m, d).getDay() + 6) % 7; }

  function buildMonthGrid(year, month0){
    var total = daysInMonth(year, month0);
    var firstIdx = mondayIndex(year, month0, 1);
    var cells = [];
    for (var i=0; i<firstIdx; i++) cells.push({ date:null, day:null });
    for (var d=1; d<=total; d++) cells.push({ date: ymdStr(year, month0, d), day: d });
    while (cells.length % 7 !== 0) cells.push({ date:null, day:null });
    var weeks = [];
    for (var i=0; i<cells.length; i+=7) weeks.push(cells.slice(i, i+7));
    return weeks;
  }

  function distributeEventsByDay(rows, gridStart, gridEnd){
    var byDay = {};
    (rows||[]).forEach(function(r){
      var start = r.start_date < gridStart ? gridStart : r.start_date;
      var end = r.end_date > gridEnd ? gridEnd : r.end_date;
      if (start > end) return;
      var p = start.split("-").map(Number);
      var cursor = new Date(p[0], p[1]-1, p[2]);
      var ep = end.split("-").map(Number);
      var endDate = new Date(ep[0], ep[1]-1, ep[2]);
      while (cursor <= endDate){
        var key = ymdStr(cursor.getFullYear(), cursor.getMonth(), cursor.getDate());
        (byDay[key] = byDay[key] || []).push({
          employeeName: (r.employees && r.employees.full_name) || "-",
          type: r.type, status: r.status, id: r.id
        });
        cursor.setDate(cursor.getDate() + 1);
      }
    });
    return byDay;
  }

  function renderCalendar(){
    if (state.calendarYear == null){ var t = new Date(); state.calendarYear = t.getFullYear(); state.calendarMonth = t.getMonth(); }
    var el = document.getElementById("tab-content");
    el.innerHTML = '<div class="loading-spinner"><div class="spinner"></div> Memuat kalender...</div>';

    Promise.all([
      api("/rest/v1/leave_requests?select=*,employees(full_name)&status=eq.Approved", { method:"GET" }),
      loadHolidays(),
      api("/rest/v1/institutional_events?select=*&order=start_date.asc", { method:"GET" }).catch(function(){ return []; })
    ])
      .then(function(results){
        var rows = results[0], holidays = results[1] || {}, events = results[2] || [];
        var year = state.calendarYear, month0 = state.calendarMonth;
        var weeks = buildMonthGrid(year, month0);
        var gridStart = weeks[0][0].date || ymdStr(year, month0, 1);
        var lastRow = weeks[weeks.length-1];
        var gridEnd = lastRow[6].date || ymdStr(year, month0, daysInMonth(year, month0));
        // gridStart/gridEnd above only cover in-month cells; leading/trailing
        // blanks are never populated anyway, so restricting distribution to
        // the month itself (not the padded grid) is correct and simpler.
        gridStart = ymdStr(year, month0, 1);
        gridEnd = ymdStr(year, month0, daysInMonth(year, month0));
        var byDay = distributeEventsByDay(rows, gridStart, gridEnd);
        var eventsByDay = {};
        events.forEach(function(ev){
          var s = ev.start_date < gridStart ? gridStart : ev.start_date;
          var e2 = ev.end_date > gridEnd ? gridEnd : ev.end_date;
          if (s > e2) return;
          var p = s.split("-").map(Number), cursor = new Date(p[0],p[1]-1,p[2]);
          var ep = e2.split("-").map(Number), endDate = new Date(ep[0],ep[1]-1,ep[2]);
          while (cursor <= endDate){
            var key = ymdStr(cursor.getFullYear(), cursor.getMonth(), cursor.getDate());
            (eventsByDay[key] = eventsByDay[key] || []).push(ev);
            cursor.setDate(cursor.getDate()+1);
          }
        });
        var eventCategoriesPresent = {};
        events.forEach(function(ev){ eventCategoriesPresent[ev.category] = true; });
        var legendCategories = Object.keys(EVENT_CATEGORY_COLORS).filter(function(c){ return eventCategoriesPresent[c]; });

        var typesPresent = {};

        var legendTypes = Object.keys(LEAVE_TYPE_COLORS).filter(function(t){ return typesPresent[t]; });
        if (!legendTypes.length) legendTypes = Object.keys(LEAVE_TYPE_COLORS);

        var todayStr = ymdStr(new Date().getFullYear(), new Date().getMonth(), new Date().getDate());

        var html = '<div class="card" style="padding:0;overflow:hidden;">' +
          '<div style="display:flex;flex-wrap:wrap;">' +
          '<div style="width:200px;flex-shrink:0;background:var(--brand-dark);color:#fff;padding:20px 16px;">' +
            '<div style="font-family:\'Philosopher\',serif;font-size:24px;font-weight:700;line-height:1.15;">' + MONTH_NAMES_ID[month0] + '</div>' +
            '<div style="font-family:\'Philosopher\',serif;font-size:24px;font-weight:700;margin-bottom:14px;">' + year + '</div>' +
            '<div class="btn-group" style="margin-bottom:18px;">' +
              '<button class="btn btn-sm" id="cal-prev" style="background:rgba(255,255,255,.15);color:#fff;border:none;">‹</button>' +
              '<button class="btn btn-sm" id="cal-today" style="background:rgba(255,255,255,.15);color:#fff;border:none;">Hari ini</button>' +
              '<button class="btn btn-sm" id="cal-next" style="background:rgba(255,255,255,.15);color:#fff;border:none;">›</button>' +
            '</div>' +
            '<div style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--brand-light);margin-bottom:10px;">Jenis Cuti</div>' +
            legendTypes.map(function(t){
              var c = leaveColor(t);
              return '<div style="display:flex;align-items:center;gap:8px;margin-bottom:9px;">' +
                '<span style="width:10px;height:10px;border-radius:50%;background:' + c.fg + ';flex-shrink:0;"></span>' +
                '<span style="font-size:12px;">' + escHtml(t) + '</span></div>';
            }).join('') +
            '<div style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--brand-light);margin:14px 0 10px;">Kalender Indonesia</div>' +
            '<div style="display:flex;align-items:center;gap:8px;margin-bottom:9px;"><span style="width:10px;height:10px;border-radius:50%;background:#e35c5c;flex-shrink:0;"></span><span style="font-size:12px;">Hari Libur Nasional</span></div>' +
            '<div style="display:flex;align-items:center;gap:8px;margin-bottom:9px;"><span style="width:10px;height:10px;border-radius:50%;border:2px solid #e3a53c;background:transparent;flex-shrink:0;"></span><span style="font-size:12px;">Hari Penting (bukan libur)</span></div>' +
            (can("canManageEvents") ? '<button class="btn btn-sm" id="cal-add-event" style="width:100%;margin-top:6px;margin-bottom:10px;background:rgba(255,255,255,.15);color:#fff;border:none;">+ Tambah Jadwal</button>' : '') +
            (legendCategories.length ? '<div style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--brand-light);margin:14px 0 10px;">Kegiatan Lembaga</div>' +
              legendCategories.map(function(c){
                return '<div style="display:flex;align-items:center;gap:8px;margin-bottom:9px;"><span style="width:10px;height:10px;border-radius:2px;background:' + eventColor(c) + ';flex-shrink:0;"></span><span style="font-size:12px;">' + escHtml(c) + '</span></div>';
              }).join('') : '') +
          '</div>' +
          '<div style="flex:1;min-width:280px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));">' +
          DAY_NAMES_ID.map(function(d){ return '<div style="background:var(--surface-2);padding:8px 6px;font-size:12px;font-weight:600;text-align:center;border-bottom:1px solid var(--border);color:var(--ink-2);">' + d + '</div>'; }).join('') +
          weeks.map(function(week){
            return week.map(function(cell, i){
              if (cell.day === null) return '<div style="border-bottom:1px solid var(--border);' + (i<6?'border-right:1px solid var(--border);':'') + 'min-height:64px;background:var(--surface-2);"></div>';
              var events = byDay[cell.date] || [];
              var isToday = cell.date === todayStr;
              var holiday = holidays[cell.date] || null;
              var dayNumHtml;
              if (holiday && holiday.holiday){
                dayNumHtml = '<div title="' + escHtml(holiday.summary) + '" style="display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:#e35c5c;color:#fff;font-size:11px;font-weight:700;">' + cell.day + '</div>';
              } else if (holiday){
                dayNumHtml = '<div title="' + escHtml(holiday.summary) + '" style="display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;border:2px solid #e3a53c;font-size:11px;font-weight:' + (isToday?'700':'400') + ';color:' + (isToday?'var(--brand-dark)':'var(--ink)') + ';">' + cell.day + '</div>';
              } else {
                dayNumHtml = '<div style="font-size:11px;font-weight:' + (isToday?'700':'400') + ';color:' + (isToday?'var(--brand-dark)':'var(--ink)') + ';">' + cell.day + '</div>';
              }
              var holidayLabel = holiday ? '<div style="font-size:9px;color:' + (holiday.holiday?'#e35c5c':'#b8862c') + ';margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + escHtml(holiday.summary) + '</div>' : '';
              var chips = events.slice(0,3).map(function(e){
                var c = leaveColor(e.type);
                return '<div title="' + escHtml(e.employeeName + ' — ' + e.type) + '" style="font-size:10px;background:' + c.bg + ';color:' + c.fg + ';border-radius:4px;padding:1px 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + escHtml(e.employeeName) + '</div>';
              }).join('');
              var more = events.length > 3 ? '<div style="font-size:9px;color:var(--muted);margin-top:2px;">+' + (events.length-3) + ' lagi</div>' : '';
              var instEvents = eventsByDay[cell.date] || [];
              var instChips = instEvents.slice(0,2).map(function(ev){
                var c = eventColor(ev.category);
                return '<div class="' + (can("canManageEvents")?'inst-event-chip':'') + '" data-event-id="' + escHtml(ev.id) + '" title="' + escHtml(ev.title + (ev.description?(' — '+ev.description):'')) + '" style="font-size:10px;border-left:3px solid ' + c + ';padding:1px 3px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);' + (can("canManageEvents")?'cursor:pointer;':'') + '">' + escHtml(ev.title) + '</div>';
              }).join('');
              var instMore = instEvents.length > 2 ? '<div style="font-size:9px;color:var(--muted);margin-top:1px;">+' + (instEvents.length-2) + ' kegiatan lagi</div>' : '';
              var addCellBtn = (can("canManageEvents")) ? '<div class="add-event-cell-btn" data-date="' + escHtml(cell.date) + '" title="Tambah jadwal di tanggal ini" style="font-size:10px;color:var(--muted);cursor:pointer;margin-top:2px;">+ jadwal</div>' : '';
              return '<div style="border-bottom:1px solid var(--border);' + (i<6?'border-right:1px solid var(--border);':'') + 'min-height:64px;padding:4px;' + (isToday?'background:var(--metric-bg);':'') + '">' +
                dayNumHtml + holidayLabel +
                chips + more +
                instChips + instMore + addCellBtn +
              '</div>';
            }).join('');
          }).join('') +
          '</div></div></div>';

        el.innerHTML = html;
        document.getElementById("cal-prev").onclick = function(){ state.calendarMonth--; if(state.calendarMonth<0){state.calendarMonth=11;state.calendarYear--;} renderCalendar(); };
        document.getElementById("cal-next").onclick = function(){ state.calendarMonth++; if(state.calendarMonth>11){state.calendarMonth=0;state.calendarYear++;} renderCalendar(); };
        document.getElementById("cal-today").onclick = function(){ var t=new Date(); state.calendarYear=t.getFullYear(); state.calendarMonth=t.getMonth(); renderCalendar(); };
        if (can("canManageEvents")){
          var addBtn = document.getElementById("cal-add-event");
          if (addBtn) addBtn.onclick = function(){ openEventModal(null, ymdStr(year, month0, new Date().getDate())); };
          Array.prototype.forEach.call(el.querySelectorAll(".inst-event-chip"), function(chip){
            var evId = chip.getAttribute("data-event-id");
            var found = events.find(function(ev){ return ev.id === evId; });
            chip.onclick = function(){ if (found) openEventModal(found); };
          });
          Array.prototype.forEach.call(el.querySelectorAll(".add-event-cell-btn"), function(btn){
            var dateStr = btn.getAttribute("data-date");
            btn.onclick = function(){ openEventModal(null, dateStr); };
          });
        }
      })
      .catch(function(e){
        el.innerHTML = '<div class="err">⚠ Gagal memuat kalender: ' + escHtml(e.message) + '</div>';
      });
  }

  /* ================================================================
     RENDER: DASHBOARD
     ================================================================ */
  function renderDashboard(){
    var el = document.getElementById("tab-content");
    if (state.loading){ el.innerHTML = '<div class="loading-spinner"><div class="spinner"></div> Memuat data...</div>'; return; }
    var emps = state.employees;
    var total = emps.length;
    var aktif = emps.filter(function(e){ return e.active_status; }).length;
    var akanBerakhir = emps.filter(function(e){ var d = daysUntil(e.contract_end); return d!==null && d>=0 && d<=30; });
    var scored = emps.map(function(e){ var r = latestReview(e.id); return { emp:e, score: r?parseFloat(r.score_total):null, predikat:r?r.predikat:null }; }).filter(function(x){ return x.score!==null; });
    var avgScore = scored.length ? (scored.reduce(function(s,x){ return s+x.score; },0)/scored.length).toFixed(1) : "-";
    scored.sort(function(a,b){ return b.score-a.score; });
    var top = scored.slice(0,5);
    var bottom = scored.slice(-3).reverse();
    var byUnit = {};
    emps.forEach(function(e){ var u = (e.m_unit_kerja && e.m_unit_kerja.nama) || "Tanpa Unit"; byUnit[u]=(byUnit[u]||0)+1; });
    var byGender = { L:0, P:0, lain:0 };
    emps.forEach(function(e){ if(e.gender==="L") byGender.L++; else if(e.gender==="P") byGender.P++; else byGender.lain++; });
    function predikatBadge(p){
      if (!p) return '<span class="badge badge-gray">-</span>';
      var cls = (p==="Sangat Baik"||p==="Baik")?"badge-green": p==="Cukup"?"badge-amber":"badge-red";
      return '<span class="badge ' + cls + '">' + escHtml(p) + '</span>';
    }
    var html =
      '<div class="grid grid-4" style="margin-bottom:12px;">' +
        '<div class="metric"><p class="lbl">Total Pegawai</p><p class="val">' + total + '</p><p class="trend">Seluruh data pegawai</p></div>' +
        '<div class="metric"><p class="lbl">Pegawai Aktif</p><p class="val">' + aktif + '</p><p class="trend">' + (total?Math.round(aktif/total*100):0) + '% dari total</p></div>' +
        '<div class="metric"><p class="lbl">Kontrak ≤ 30 Hari</p><p class="val">' + akanBerakhir.length + '</p><p class="trend">Perlu perhatian</p></div>' +
        '<div class="metric"><p class="lbl">Rata-rata Kinerja</p><p class="val">' + avgScore + '</p><p class="trend">Dari ' + scored.length + ' penilaian</p></div>' +
      '</div>';

    if (akanBerakhir.length){
      html += '<div class="section-title">⚠ Kontrak Akan Berakhir</div><div class="card"><div class="table-wrap"><table>' +
        '<tr><th>Nama</th><th>Jabatan</th><th>Unit Kerja</th><th>Berakhir</th><th>Sisa Hari</th></tr>' +
        akanBerakhir.map(function(e){
          var d = daysUntil(e.contract_end);
          return '<tr><td>' + escHtml(e.full_name) + '</td><td>' + escHtml((e.m_jabatan&&e.m_jabatan.nama)||"-") + '</td><td>' + escHtml((e.m_unit_kerja&&e.m_unit_kerja.nama)||"-") + '</td><td>' + fmtDate(e.contract_end) + '</td><td><span class="badge ' + (d<=7?"badge-red":"badge-amber") + '">' + d + ' hari</span></td></tr>';
        }).join('') + '</table></div></div>';
    }

    html += '<div class="grid grid-2">' +
      '<div>' +
        '<div class="section-title">🏆 Top Performer</div>' +
        '<div class="card"><div class="table-wrap"><table><tr><th>#</th><th>Nama</th><th>Skor</th><th>Predikat</th></tr>' +
        (top.length ? top.map(function(x,i){ return '<tr><td><b>' + (i+1) + '</b></td><td>' + escHtml(x.emp.full_name) + '</td><td>' + x.score.toFixed(1) + '</td><td>' + predikatBadge(x.predikat) + '</td></tr>'; }).join('') : '<tr><td colspan="4" style="color:var(--muted);">Belum ada data penilaian</td></tr>') +
        '</table></div></div>' +
      '</div>' +
      '<div>' +
        '<div class="section-title">📋 Perlu Pembinaan</div>' +
        '<div class="card"><div class="table-wrap"><table><tr><th>Nama</th><th>Skor</th><th>Predikat</th></tr>' +
        (bottom.length ? bottom.map(function(x){ return '<tr><td>' + escHtml(x.emp.full_name) + '</td><td>' + x.score.toFixed(1) + '</td><td>' + predikatBadge(x.predikat) + '</td></tr>'; }).join('') : '<tr><td colspan="3" style="color:var(--muted);">Belum ada data</td></tr>') +
        '</table></div></div>' +
      '</div>' +
    '</div>';

    html += '<div class="section-title">🏢 Distribusi per Unit Kerja</div><div class="card"><div class="table-wrap"><table><tr><th>Unit Kerja</th><th>Jumlah</th><th>Komposisi</th></tr>' +
      Object.keys(byUnit).map(function(u){
        var pct = total ? Math.round(byUnit[u]/total*100) : 0;
        return '<tr><td>' + escHtml(u) + '</td><td>' + byUnit[u] + '</td><td><div style="background:var(--border);border-radius:4px;height:8px;width:100%;"><div style="background:var(--brand-dark);border-radius:4px;height:8px;width:' + pct + '%;"></div></div></td></tr>';
      }).join('') + '</table></div></div>';

    el.innerHTML = html;
  }

  /* ================================================================
     RENDER: HR ANALYTICS DASHBOARD
     ================================================================ */
  function renderAnalytics(){
    var el = document.getElementById("tab-content");
    if (state.loading){ el.innerHTML = '<div class="loading-spinner"><div class="spinner"></div> Memuat data...</div>'; return; }
    var emps = state.employees;
    var byUnit = {}; var byGender = {L:0,P:0,Lainnya:0}; var byStatus = {};
    var byJenis = {}; var joinByYear = {};
    emps.forEach(function(e){
      var u = (e.m_unit_kerja&&e.m_unit_kerja.nama)||"Tanpa Unit"; byUnit[u]=(byUnit[u]||0)+1;
      if(e.gender==="L") byGender.L++; else if(e.gender==="P") byGender.P++; else byGender.Lainnya++;
      var s=(e.m_status_kepegawaian&&e.m_status_kepegawaian.nama)||"Tidak Diketahui"; byStatus[s]=(byStatus[s]||0)+1;
      var j=(e.m_jenis_kepegawaian&&e.m_jenis_kepegawaian.nama)||"Tidak Diketahui"; byJenis[j]=(byJenis[j]||0)+1;
      if(e.join_date){ var yr=new Date(e.join_date).getFullYear(); joinByYear[yr]=(joinByYear[yr]||0)+1; }
    });
    var scored = emps.map(function(e){ var r=latestReview(e.id); return r?parseFloat(r.score_total):null; }).filter(function(x){ return x!==null; });
    var scoreRanges = {"< 60":0, "60-70":0, "70-80":0, "80-90":0, "≥ 90":0};
    scored.forEach(function(s){ if(s<60) scoreRanges["< 60"]++; else if(s<70) scoreRanges["60-70"]++; else if(s<80) scoreRanges["70-80"]++; else if(s<90) scoreRanges["80-90"]++; else scoreRanges["≥ 90"]++; });
    var sortedYears = Object.keys(joinByYear).sort();
    var palette = ['#0E505A','#3F8D58','#7DD857','#50A158','#2E7859','#0a3d45','#6dba4a','#1e6040'];

    el.innerHTML =
      '<div class="section-title">📈 Analitik HR — Ringkasan Visual</div>' +
      '<div class="grid grid-2">' +
        '<div class="analytics-card"><h4>Distribusi Unit Kerja</h4><div class="chart-wrap"><canvas id="c-unit"></canvas></div></div>' +
        '<div class="analytics-card"><h4>Komposisi Gender</h4><div class="chart-wrap"><canvas id="c-gender"></canvas></div></div>' +
        '<div class="analytics-card"><h4>Status Kepegawaian</h4><div class="chart-wrap"><canvas id="c-status"></canvas></div></div>' +
        '<div class="analytics-card"><h4>Jenis Kepegawaian</h4><div class="chart-wrap"><canvas id="c-jenis"></canvas></div></div>' +
        '<div class="analytics-card"><h4>Tren Rekrutmen per Tahun</h4><div class="chart-wrap"><canvas id="c-join"></canvas></div></div>' +
        '<div class="analytics-card"><h4>Distribusi Skor Kinerja</h4><div class="chart-wrap"><canvas id="c-score"></canvas></div></div>' +
      '</div>';

    // Helper
    function mkChart(id, type, labels, data, opts){
      var ctx = document.getElementById(id);
      if(!ctx) return;
      var isDark = getTheme()==='dark';
      var textColor = isDark ? '#8aada8' : '#5b6b66';
      var gridColor = isDark ? '#2e4440' : '#e3e3e0';
      var instance = new Chart(ctx, {
        type: type,
        data: {
          labels: labels,
          datasets: [{ data: data, backgroundColor: palette, borderColor: type==='line'?palette[0]:undefined, borderWidth: type==='line'?2.5:1.5, fill: type==='line', tension:0.4, pointRadius:4 }]
        },
        options: Object.assign({
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: type!=='bar'&&type!=='line', labels:{ color:textColor, boxWidth:12, font:{size:11} } } },
          scales: (type==='bar'||type==='line') ? { x:{ticks:{color:textColor,font:{size:10}},grid:{color:gridColor}}, y:{ticks:{color:textColor,font:{size:10}},grid:{color:gridColor},beginAtZero:true} } : undefined
        }, opts||{})
      });
      state.chartInstances[id] = instance;
    }

    setTimeout(function(){
      mkChart('c-unit', 'doughnut', Object.keys(byUnit), Object.values(byUnit));
      mkChart('c-gender', 'pie', Object.keys(byGender), Object.values(byGender));
      mkChart('c-status', 'doughnut', Object.keys(byStatus), Object.values(byStatus));
      mkChart('c-jenis', 'doughnut', Object.keys(byJenis), Object.values(byJenis));
      mkChart('c-join', 'bar', sortedYears, sortedYears.map(function(y){ return joinByYear[y]; }));
      mkChart('c-score', 'bar', Object.keys(scoreRanges), Object.values(scoreRanges));
    }, 50);
  }

  /* ================================================================
     LEAVE MANAGEMENT
     ================================================================ */
  function loadLeaveRequests(){
    state.loading = true; render();
    api("/rest/v1/leave_requests?select=*,employees(full_name)&order=created_at.desc", { method:"GET" })
      .then(function(rows){
        state.leaveRequests = rows || [];
        state.loading = false;
        renderLeaveManagement();
      })
      .catch(function(e){ state.errorMsg = "Gagal memuat cuti: " + e.message; state.loading=false; render(); });
  }

  function renderLeaveManagement(){
    var el = document.getElementById("tab-content");
    if (state.loading){ el.innerHTML = '<div class="loading-spinner"><div class="spinner"></div> Memuat data...</div>'; return; }
    var rows = state.leaveRequests || [];

    var html = '<div class="btn-group" style="margin-bottom:12px;">' +
      '<div class="section-title" style="margin:0;flex:1;">🗓 Manajemen Cuti & Izin</div>' +
      '<button class="btn btn-primary btn-sm" id="new-leave-btn">+ Ajukan Cuti</button>' +
    '</div>';

    // Summary stats
    var pending = rows.filter(function(r){ return r.status==="Pending"; }).length;
    var approved = rows.filter(function(r){ return r.status==="Approved"; }).length;
    html += '<div class="grid grid-3" style="margin-bottom:12px;">' +
      '<div class="metric"><p class="lbl">Total Pengajuan</p><p class="val">' + rows.length + '</p></div>' +
      '<div class="metric"><p class="lbl">Menunggu</p><p class="val" style="color:var(--badge-amber-fg);">' + pending + '</p></div>' +
      '<div class="metric"><p class="lbl">Disetujui</p><p class="val" style="color:var(--badge-green-fg);">' + approved + '</p></div>' +
    '</div>';

    html += '<div class="card"><div class="table-wrap"><table>' +
      '<tr><th>Pegawai</th><th>Jenis</th><th>Mulai</th><th>Selesai</th><th>Status</th>' +
      (can("canApproveLeave") ? '<th>Aksi</th>' : '') + '</tr>' +
      (rows.length ? rows.map(function(r){
        var statusBadge =
          r.status==="Approved" ? '<span class="badge badge-green">✓ Disetujui</span>' :
          r.status==="Rejected" ? '<span class="badge badge-red">✕ Ditolak</span>' :
          '<span class="badge badge-amber">⏳ Pending</span>';
        var actions = '';
        if (can("canApproveLeave") && r.status==="Pending"){
          actions = '<button class="btn btn-success btn-sm" onclick="approveLeave(\'' + r.id + '\')">Setujui</button> ' +
                    '<button class="btn btn-danger btn-sm" onclick="rejectLeave(\'' + r.id + '\')">Tolak</button>';
        }
        return '<tr><td>' + escHtml((r.employees&&r.employees.full_name)||"-") + '</td><td>' + escHtml(r.type||"-") + '</td><td>' + fmtDate(r.start_date) + '</td><td>' + fmtDate(r.end_date) + '</td><td>' + statusBadge + '</td>' + (can("canApproveLeave")?"<td>"+actions+"</td>":"") + '</tr>';
      }).join('') : '<tr><td colspan="6" style="color:var(--muted);text-align:center;padding:20px;">Tidak ada data cuti</td></tr>') +
      '</table></div></div>';

    el.innerHTML = html;
    document.getElementById("new-leave-btn").onclick = openLeaveModal;
  }

  window.approveLeave = function(id){
    api("/rest/v1/leave_requests?id=eq."+id, { method:"PATCH", headers:{Prefer:"return=minimal"}, body:{status:"Approved", updated_at:new Date().toISOString()} })
      .then(function(){ loadLeaveRequests(); })
      .catch(function(e){ alert("Gagal menyetujui: " + e.message); });
  };

      var currentUid = state.user && state.user.id;

        return {

        downloadXlsx(template, "Template_Import_Pegawai.xlsx", "Template");
      };

      var importedData = null;
      document.getElementById("import-file").onchange = function(ev){
        var file = ev.target.files[0]; if(!file) return;
        var reader = new FileReader();
        reader.onload = function(e){
          try {
            var wb = XLSX.read(e.target.result, {type:"binary"});
            var ws = wb.Sheets[wb.SheetNames[0]];
            var json = XLSX.utils.sheet_to_json(ws);
            importedData = json;
            var prevEl = document.getElementById("import-preview");
            var submitBtn = document.getElementById("import-submit");
            document.getElementById("import-error").textContent = "";
            if (json.length === 0){ prevEl.innerHTML = '<p class="err">File kosong atau format tidak sesuai.</p>'; submitBtn.style.display="none"; return; }
            // Preview first 5 rows
            var keys = Object.keys(json[0]);
            var previewHtml = '<p style="font-size:12px;color:var(--muted);margin-bottom:6px;">Preview ' + Math.min(5,json.length) + ' dari ' + json.length + ' baris:</p>' +
              '<div class="table-wrap"><table><tr>' + keys.slice(0,5).map(function(k){ return '<th>'+escHtml(k)+'</th>'; }).join('') + '</tr>' +

            prevEl.innerHTML = previewHtml;
            submitBtn.style.display = "inline-flex";
          } catch(err){ document.getElementById("import-error").textContent = "Error membaca file: " + err.message; }
        };
        reader.readAsBinaryString(file);
      };

      document.getElementById("import-submit").onclick = function(){
        if (!importedData || !importedData.length){ return; }
        var btn = document.getElementById("import-submit");
        btn.disabled = true; btn.textContent = "⏳ Mengimpor...";
        var errEl = document.getElementById("import-error");
        // Map and upsert rows
        var rows = importedData.map(function(r){
          return {
            employee_number: r["No. Pegawai"] || null,
            full_name: r["Nama Lengkap"] || null,
            nik: r["NIK"] ? String(r["NIK"]) : null,
            gender: r["Jenis Kelamin"]==="Laki-laki"?"L": r["Jenis Kelamin"]==="Perempuan"?"P": (r["Jenis Kelamin"]||null),
            birth_place: r["Tempat Lahir"] || null,
            birth_date: r["Tanggal Lahir"] || null,
            institution_email: r["Email"] || null,
            mobile_phone: r["No. HP"] ? String(r["No. HP"]) : null,
            address: r["Alamat"] || null,
            join_date: r["Tanggal Bergabung"] || null,
            updated_at: new Date().toISOString()
          };
        }).filter(function(r){ return r.full_name; });
        var withoutNumber = rows.filter(function(r){ return !r.employee_number; }).length;
        rows = rows.filter(function(r){ return r.employee_number; });
        if (!rows.length){ errEl.textContent = "Tidak ada baris valid ditemukan (No. Pegawai wajib diisi)."; btn.disabled=false; btn.textContent="Import Data"; return; }
        // on_conflict=employee_number: without this, PostgREST's upsert
        // conflict target defaults to the primary key (id), which every
        // imported row lacks (id is generated fresh per row) -- so
        // "merge-duplicates" never actually found a duplicate to merge, and
        // re-importing an existing employee_number instead hard-failed on
        // its unique constraint. This makes re-import genuinely update
        // existing employees by employee_number, as the Prefer header intends.
        api("/rest/v1/employees?on_conflict=employee_number", { method:"POST", headers:{ Prefer:"resolution=merge-duplicates,return=minimal" }, body: rows })
          .then(function(){
            errEl.style.color = "var(--badge-green-fg)";
            errEl.textContent = "✓ " + rows.length + " baris berhasil diimpor!" + (withoutNumber ? " (" + withoutNumber + " baris dilewati: No. Pegawai kosong)" : "");
            btn.disabled=false; btn.textContent="Import Data";
            loadAll();
          })
          .catch(function(e){ errEl.style.color=""; errEl.textContent = "Gagal import: " + e.message; btn.disabled=false; btn.textContent="Import Data"; });
      };
    }
  }

  function downloadXlsx(data, filename, sheetName){
    var ws = XLSX.utils.json_to_sheet(data);
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, sheetName || "Data");
    XLSX.writeFile(wb, filename);
  }

  /* ================================================================
     FITUR 3: CALENDAR INTEGRATION (iCal download + Google Calendar link,
     no OAuth -- see calendar_integration.js in /database/testdb for the
     standalone-tested version of this exact logic)
     ================================================================ */
  function pad2b(n){ return n < 10 ? "0"+n : ""+n; }
  function toIcsDate(ymd){ return ymd.replace(/-/g, ""); }
  function addOneDay(ymd){
    var p = ymd.split("-").map(Number);
    var d = new Date(p[0], p[1]-1, p[2]);
    d.setDate(d.getDate() + 1);
    return d.getFullYear() + "-" + pad2b(d.getMonth()+1) + "-" + pad2b(d.getDate());
  }
  function icsEscape(s){ return String(s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n"); }
  function buildIcsEvent(opts){
    var uid = (opts.uid || (Date.now() + "-" + Math.random().toString(36).slice(2))) + "@hris-alfalah";
    var dtStart = toIcsDate(opts.dateStr), dtEnd = toIcsDate(addOneDay(opts.dateStr));
    return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//HRIS Al-Falah//ID","BEGIN:VEVENT",
      "UID:"+uid, "DTSTAMP:"+toIcsDate(opts.dateStr)+"T000000Z",
      "DTSTART;VALUE=DATE:"+dtStart, "DTEND;VALUE=DATE:"+dtEnd,
      "SUMMARY:"+icsEscape(opts.title), "DESCRIPTION:"+icsEscape(opts.description||""),
      "END:VEVENT","END:VCALENDAR"].join("\r\n");
  }
  function buildGoogleCalendarUrl(opts){
    var start = toIcsDate(opts.dateStr), end = toIcsDate(addOneDay(opts.dateStr));
    var params = new URLSearchParams({ action:"TEMPLATE", text:opts.title, dates:start+"/"+end, details:opts.description||"" });
    return "https://calendar.google.com/calendar/render?" + params.toString();
  }
  function downloadIcs(opts){
    var blob = new Blob([buildIcsEvent(opts)], { type: "text/calendar;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = (opts.title||"event").replace(/[^a-z0-9]+/gi,"_") + ".ics";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }
  function addToCalendarButtons(dateStr, title, description){
    if (!dateStr) return "";
    return ' <button class="btn btn-sm ical-btn" data-date="' + escHtml(dateStr) + '" data-title="' + escHtml(title) + '" data-desc="' + escHtml(description||"") + '">📅 .ics</button>' +
      ' <a class="btn btn-sm" target="_blank" rel="noopener" href="' + buildGoogleCalendarUrl({dateStr:dateStr,title:title,description:description}) + '">📅 Google Calendar</a>';
  }
  function wireCalendarButtons(container){
    var btns = container.querySelectorAll(".ical-btn");
    for (var i=0;i<btns.length;i++){
      btns[i].onclick = function(){
        downloadIcs({ dateStr: this.getAttribute("data-date"), title: this.getAttribute("data-title"), description: this.getAttribute("data-desc") });
      };
    }
  }

  function opts(list, valueField, labelField, selected){
    return '<option value="">-</option>' + list.map(function(o){
      return '<option value="' + o[valueField] + '" ' + (o[valueField]===selected?'selected':'') + '>' + escHtml(o[labelField]) + '</option>';
    }).join('');
  }

     Generic config-driven CRUD so 13 near-identical tables don't need

     maps 1:1 to a real table + its RLS policy shape (documented per module
     below, matching database/batch2_remaining_modules.sql exactly).

  var MASTER_LABEL_FIELD = {
    bank:'nama', unit:'nama', dept:'nama', jabatan:'nama', statusKp:'nama', jenisKp:'nama', agama:'nama', kawin:'nama',
    competencyLevels:'name', languages:'name', shiftTypes:'name', payrollComponentTypes:'name'
  };

    if (!id) return "-";
    var list = state.masters[masterKey] || [];
    var found = list.find(function(x){ return x.id === id; });
    if (!found) return "-";
    var lf = MASTER_LABEL_FIELD[masterKey] || 'nama';
    return found[lf] || found.nama || found.name || "-";
  }

  var CHILD_MODULES = [
    { key:'contacts', table:'employee_contacts', title:'📞 Kontak Tambahan', editPerm:'canEdit', deletable:true,
      listCols:[
        { k:'contact_type', label:'Jenis', fmt:function(v){ return {home:'Rumah',work:'Kerja',emergency:'Darurat',other:'Lainnya'}[v]||v; } },

        { k:'is_primary', label:'Utama', fmt:function(v){ return v?'Ya':'-'; } }

      fields:[
        { k:'contact_type', label:'Jenis', type:'select', required:true, options:[['home','Rumah'],['work','Kerja'],['emergency','Darurat'],['other','Lainnya']] },
        { k:'full_name', label:'Nama', type:'text' }, { k:'relationship', label:'Hubungan', type:'text' },
        { k:'phone', label:'Telepon', type:'text' }, { k:'email', label:'Email', type:'text' }, { k:'address', label:'Alamat', type:'text' },
        { k:'is_primary', label:'Jadikan Utama', type:'checkbox' }, { k:'notes', label:'Catatan', type:'text' }
      ]
    },
    { key:'bankAccounts', table:'employee_bank_accounts', title:'🏦 Rekening Bank', editPerm:'canEdit', deletable:true,
      listCols:[
        { k:'bank_id', label:'Bank', fmt:function(v){ return masterLabel('bank', v); } },
        { k:'account_number', label:'No. Rekening' }, { k:'account_holder_name', label:'Atas Nama' },
        { k:'is_primary', label:'Utama', fmt:function(v){ return v?'Ya':'-'; } }
      ],
      fields:[
        { k:'bank_id', label:'Bank', type:'select-master', master:'bank', required:true },
        { k:'account_number', label:'No. Rekening', type:'text', required:true },

        { k:'branch', label:'Cabang', type:'text' }, { k:'is_primary', label:'Jadikan Utama', type:'checkbox' }

  function loadChildRecords(employeeId){
    var reqs = CHILD_MODULES.map(function(m){
      var url = "/rest/v1/" + m.table + "?select=*&employee_id=eq." + employeeId;
      if (!m.appendOnly) url += "&deleted_at=is.null";
      url += "&order=created_at.desc";
      return api(url).catch(function(){ return []; });
    });
    return Promise.all(reqs).then(function(results){
      var data = {};
      CHILD_MODULES.forEach(function(m, i){ data[m.key] = results[i] || []; });
      state.childRecords[employeeId] = data;
    });
  }

  function renderChildField(moduleKey, f){
    var id = 'cf-' + moduleKey + '-' + f.k;
    if (f.type === 'checkbox'){
      return '<div class="field" style="display:flex;align-items:center;gap:6px;padding-top:18px;"><input type="checkbox" id="' + id + '" style="width:auto;" ' + (f.default?'checked':'') + ' /><label style="margin:0;">' + escHtml(f.label) + '</label></div>';
    }
    var label = '<label>' + escHtml(f.label) + (f.required?' *':'') + '</label>';
    var input;
    if (f.type === 'select'){
      input = '<select id="' + id + '"><option value="">-</option>' + f.options.map(function(o){ return '<option value="' + escHtml(o[0]) + '">' + escHtml(o[1]) + '</option>'; }).join('') + '</select>';
    } else if (f.type === 'select-master'){
      var lf = MASTER_LABEL_FIELD[f.master] || 'nama';
      input = '<select id="' + id + '">' + opts(state.masters[f.master] || [], 'id', lf, null) + '</select>';
    } else {
      input = '<input id="' + id + '" type="' + (f.type||'text') + '" ' + (f.default!==undefined ? ('value="' + escHtml(String(f.default)) + '"') : '') + ' />';
    }
    return '<div class="field">' + label + input + '</div>';
  }

  function renderChildModulesHTML(e){
    var data = state.childRecords[e.id];
    if (!data){
      if (!state._loadingChild[e.id]){
        state._loadingChild[e.id] = true;
        loadChildRecords(e.id).then(function(){ state._loadingChild[e.id] = false; render(); });
      }
      return '<div class="section-title">Data Tambahan</div><p style="color:var(--muted);font-size:13px;">⏳ Memuat data tambahan...</p>';
    }
    var out = '';
    CHILD_MODULES.forEach(function(m){
      if (m.viewPerm && !can(m.viewPerm)) return; // e.g. payroll/salary/punishment: hidden entirely, not just uneditable
      var rows = data[m.key] || [];
      var editable = can(m.editPerm);
      var showAddForm = state.childFormOpen === m.key;
      out += '<div class="section-title" style="display:flex;justify-content:space-between;align-items:center;">' + escHtml(m.title) +
        (editable ? '<button class="btn btn-sm" data-childtoggle="' + m.key + '">' + (showAddForm?'✕ Batal':'+ Tambah') + '</button>' : '') +
      '</div>';
      if (rows.length === 0){
        out += '<p style="color:var(--muted);font-size:13px;">Belum ada data.</p>';
      } else {
        out += '<div class="table-wrap"><table><tr>' + m.listCols.map(function(c){ return '<th>' + escHtml(c.label) + '</th>'; }).join('') +
          ((editable && !m.appendOnly) ? '<th></th>' : '') + '</tr>' +
          rows.map(function(r){
            return '<tr>' + m.listCols.map(function(c){
              var v = r[c.k];
              var display = c.fmt ? c.fmt(v) : (v===null||v===undefined||v===""?"-":String(v));
              return '<td>' + escHtml(String(display===null||display===undefined?"-":display)) + '</td>';
            }).join('') +
            ((editable && !m.appendOnly && state.role==='admin') ? '<td><span class="link" data-childdelete="' + m.key + '|' + r.id + '" style="color:#c0392b;">Hapus</span></td>' : ((editable && !m.appendOnly) ? '<td></td>' : '')) +
            '</tr>';
          }).join('') +
        '</table></div>';
      }
      if (showAddForm){
        out += '<div class="card" style="background:var(--surface-2,#f8f9fa);margin-top:6px;margin-bottom:14px;"><div class="grid grid-2">' +
          m.fields.map(function(f){ return renderChildField(m.key, f); }).join('') +
          '</div><button class="btn btn-primary btn-sm" data-childsave="' + m.key + '">💾 Simpan</button></div>';
      }
    });
    return out;
  }

  function wireChildModuleEvents(el, e){
    Array.prototype.forEach.call(el.querySelectorAll('[data-childtoggle]'), function(btn){
      btn.onclick = function(){
        var key = btn.getAttribute('data-childtoggle');
        state.childFormOpen = (state.childFormOpen === key) ? null : key;
        render();
      };
    });
    Array.prototype.forEach.call(el.querySelectorAll('[data-childsave]'), function(btn){
      btn.onclick = function(){
        var key = btn.getAttribute('data-childsave');
        var mod = CHILD_MODULES.find(function(m){ return m.key === key; });
        var payload = { employee_id: e.id };
        var valid = true;
        mod.fields.forEach(function(f){
          var elx = document.getElementById('cf-' + key + '-' + f.k);
          if (!elx) return;
          var v;
          if (f.type === 'checkbox'){ v = elx.checked; }
          else if (f.type === 'number'){ v = elx.value === '' ? null : Number(elx.value); }
          else { v = elx.value === '' ? null : elx.value; }
          if (f.required && (v===null || v==="")){ valid = false; }
          payload[f.k] = v;
        });
        if (!valid){ alert('Mohon lengkapi field yang wajib diisi (*)'); return; }
        api('/rest/v1/' + mod.table, { method:'POST', headers:{ Prefer:'return=minimal' }, body: payload })
          .then(function(){
            state.childFormOpen = null;
            delete state.childRecords[e.id];
            render();
          })
          .catch(function(err){ alert('Gagal menyimpan: ' + err.message); });
      };
    });
    Array.prototype.forEach.call(el.querySelectorAll('[data-childdelete]'), function(link){
      link.onclick = function(){
        var parts = link.getAttribute('data-childdelete').split('|');
        var key = parts[0], id = parts[1];
        var mod = CHILD_MODULES.find(function(m){ return m.key === key; });
        if (!confirm('Hapus data ini?')) return;
        api('/rest/v1/' + mod.table + '?id=eq.' + id, { method:'DELETE', headers:{ Prefer:'return=minimal' } })
          .then(function(){
            delete state.childRecords[e.id];
            render();
          })
          .catch(function(err){ alert('Gagal menghapus: ' + err.message); });
      };
    });
  }

      (edit
        ? '<div class="field"><label>Kontrak Berakhir</label>' + inp("ed-contractend", e.contract_end, "date") + '</div>'
        : '<div class="field"><label>Kontrak Berakhir</label><div style="padding:5px 0;font-size:13px;">' + escHtml(e.contract_end ? fmtDate(e.contract_end) : "-") + (e.contract_end ? addToCalendarButtons(e.contract_end, "Kontrak Berakhir: " + e.full_name, "Nomor pegawai " + (e.employee_number||"-") + " — mohon tindak lanjuti perpanjangan/pemutusan kontrak.") : "") + '</div></div>') +
      row("Status Aktif", e.active_status?"Aktif":"Nonaktif", '<select id="ed-active"><option value="true" '+(e.active_status?"selected":"")+'>Aktif</option><option value="false" '+(!e.active_status?"selected":"")+'>Nonaktif</option></select>') +
    '</div>';

    html += '<div class="section-title">Akademik</div><div class="grid grid-2">' +
      row("Pendidikan Terakhir", e.highest_education, inp("ed-edu", e.highest_education)) +
      row("Universitas", e.university, inp("ed-univ", e.university)) +
    '</div>';

    html += '<div class="section-title">Payroll</div><div class="grid grid-2">' +
      row("Bank", (e.m_bank&&e.m_bank.nama)||"-", '<select id="ed-bank">'+opts(m.bank,"id","nama",e.bank_id)+'</select>') +
      row("No. Rekening", e.bank_account_number, inp("ed-rek", e.bank_account_number)) +
      (can("canViewSalary")
        ? row("Gaji Pokok", fmtMoney(e.basic_salary), inp("ed-gaji", e.basic_salary, "number")) + row("Tunjangan", fmtMoney(e.allowances), inp("ed-tunj", e.allowances, "number"))
        : '<div class="field"><label>Gaji Pokok</label><div style="padding:5px 0;font-size:13px;color:var(--muted);">🔒 Data terbatas untuk Admin</div></div><div class="field"><label>Tunjangan</label><div style="padding:5px 0;font-size:13px;color:var(--muted);">🔒 Data terbatas untuk Admin</div></div>') +
    '</div>';

    if (teach){
      html += '<div class="section-title">Penugasan Mengajar</div><div class="grid grid-2">' +
        row("Mata Pelajaran", teach.subject) + row("Kelas/Jenjang", teach.grade_level) +
        row("Wali Kelas", teach.is_homeroom_teacher?"Ya":"Tidak") + row("Guru Tahfizh", teach.is_tahfizh_teacher?"Ya":"Tidak") +
      '</div>';
    }

    html += '<div class="section-title">Riwayat Penilaian Kinerja</div>';
    if (reviews.length===0){ html += '<p style="color:var(--muted);font-size:13px;">Belum ada riwayat penilaian.</p>'; }
    else {
      html += '<div class="table-wrap"><table><tr><th>Periode</th><th>Skor Total</th><th>Predikat</th><th>Rekomendasi</th></tr>' +
        reviews.map(function(r){
          var cls = (r.predikat==="Sangat Baik"||r.predikat==="Baik")?"badge-green":r.predikat==="Cukup"?"badge-amber":"badge-red";
          return '<tr><td>' + escHtml(r.review_period||"-") + '</td><td>' + escHtml(String(r.score_total||"-")) + '</td><td><span class="badge ' + cls + '">' + escHtml(r.predikat||"-") + '</span></td><td>' + escHtml(r.rekomendasi||"-") + '</td></tr>';
        }).join('') + '</table></div>';
    }

    if (edit){ html += '<div style="margin-top:16px;"><button class="btn btn-primary" id="save-btn">💾 Simpan Perubahan</button></div>'; }
    html += renderChildModulesHTML(e);
    html += '</div>';

    el.innerHTML = html;
    wireCalendarButtons(el);
    wireChildModuleEvents(el, e);
    document.getElementById("back-link").onclick = function(){ state.selectedEmployeeId=null; state.editing=false; state.selfEditing=false; state.childFormOpen=null; render(); };
    if (isOwnProfile){
      document.getElementById("self-edit-toggle").onclick = function(){ state.selfEditing = !state.selfEditing; render(); };
      if (selfEdit){
        document.getElementById("self-save-btn").onclick = function(){
          function sval(id){ var elx=document.getElementById(id); return elx?elx.value:""; }
          var payload = {
            mobile_phone: sval("se-mobile"), personal_email: sval("se-pemail"), address: sval("se-address"),
            emergency_contact_name: sval("se-ecname"), emergency_contact_phone: sval("se-ecphone"),
            updated_at: new Date().toISOString()
          };
          api("/rest/v1/employees?id=eq."+e.id, { method:"PATCH", headers:{ Prefer:"return=minimal" }, body: payload })
            .then(function(){ state.selfEditing=false; loadAll(); })
            .catch(function(err){ alert("Gagal menyimpan profil: " + err.message); });
        };
      }
    }
    if (can("canEdit")){
      document.getElementById("edit-toggle").onclick = function(){ state.editing = !state.editing; render(); };
    }
    if (edit){
      document.getElementById("save-btn").onclick = function(){
        function val(id){ var elx=document.getElementById(id); return elx?elx.value:""; }
        var payload = {
          nik: val("ed-nik"), nuptk: val("ed-nuptk"), gender: val("ed-gender")||null,
          birth_place: val("ed-birthplace"), birth_date: val("ed-birthdate")||null,
          agama_id: val("ed-agama")||null, status_perkawinan_id: val("ed-kawin")||null,
          mobile_phone: val("ed-mobile"), institution_email: val("ed-email"), address: val("ed-address"), regency: val("ed-regency"),
          status_kepegawaian_id: val("ed-statuskp")||null, jenis_kepegawaian_id: val("ed-jeniskp")||null,
          unit_kerja_id: val("ed-unit")||null, jabatan_id: val("ed-jabatan")||null,
          join_date: val("ed-join")||null, contract_end: val("ed-contractend")||null, active_status: val("ed-active")==="true",
          highest_education: val("ed-edu"), university: val("ed-univ"),
          bank_id: val("ed-bank")||null, bank_account_number: val("ed-rek"),
          basic_salary: val("ed-gaji")?Number(val("ed-gaji")):null,
          allowances: val("ed-tunj")?Number(val("ed-tunj")):null,
          updated_at: new Date().toISOString()
        };
        // Salary fields don't render at all for roles without canViewSalary
        // (see the Payroll section above) -- if we don't drop them here,
        // val() silently returns "" for the missing inputs and the ternary
        // above turns that into `null`, which would wipe the employee's
        // salary to null on every single edit a non-admin makes to ANY
        // other field. Omit the keys entirely instead so PATCH leaves them
        // untouched, matching what the user actually saw and could edit.
        if (!can("canViewSalary")){ delete payload.basic_salary; delete payload.allowances; }
        api("/rest/v1/employees?id=eq."+e.id, { method:"PATCH", headers:{ Prefer:"return=minimal" }, body: payload })
          .then(function(){ state.editing=false; loadAll(); })
          .catch(function(err){ alert("Gagal menyimpan: " + err.message); });
      };
    }
  }

  /* ================================================================
     INITIAL RENDER
     ================================================================ */
  render();

})();
</script>
</body>
</html>
